<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Configurator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            /* 深色主題變數 */
            --bg-body: #0f172a;
            --text-body: #f1f5f9;
            --text-primary: #ffffff;
            --bg-panel: #1e293b;
            --border-panel: #334155;
            --bg-input: #0f172a;
            --text-input: #f8fafc;
            --border-input: #475569;
            --bg-active-row: #334155;
            --border-active-row: #f8fafc;
            --bg-row: rgba(15, 23, 42, 0.4);
            --bg-row-hover: rgba(51, 65, 85, 0.5);
            --text-row-active: #ffffff;
            --text-row-inactive: #94a3b8;
            --text-muted: #94a3b8;
            --bg-secondary-btn: #1e293b;
            --border-secondary-btn: #334155;
            --text-secondary-btn: #cbd5e1;
            --bg-primary-btn: #f1f5f9;
            --text-primary-btn: #0f172a;
            --bg-primary-btn-hover: #ffffff;
            --bg-range-box: rgba(30, 41, 59, 0.5);
            --border-range-box: rgba(148, 163, 184, 0.3);
            
            --tag-bg: #94a3b8;
            --tag-text: #0f172a;
            --tag-bg-d: #64748b;
            --tag-text-d: #ffffff;

            /* 畫布專用變數 */
            --canvas-bg: #1e293b;
            --canvas-stroke: #334155;
            --canvas-wa-fill: rgba(255, 255, 255, 0.05);
            --canvas-wa-stroke: rgba(255, 255, 255, 0.4);
            --canvas-dash-stroke: rgba(255, 255, 255, 0.5);
            --canvas-d-dash-stroke: rgba(148, 163, 184, 0.5);
            --canvas-corner-fill: #475569;
            --canvas-dot-fill: #f8fafc;
            --canvas-text-fill: #ffffff;
            --canvas-machine-highlight: #ea580c;
        }

        body.theme-light {
            /* 明亮主題變數 */
            --bg-body: #f8fafc;
            --text-body: #0f172a;
            --text-primary: #0f172a;
            --bg-panel: #ffffff;
            --border-panel: #cbd5e1;
            --bg-input: #f1f5f9;
            --text-input: #0f172a;
            --border-input: #94a3b8;
            --bg-active-row: #e2e8f0;
            --border-active-row: #0f172a;
            --bg-row: rgba(241, 245, 249, 0.8);
            --bg-row-hover: #cbd5e1;
            --text-row-active: #0f172a;
            --text-row-inactive: #475569;
            --text-muted: #475569;
            --bg-secondary-btn: #f1f5f9;
            --border-secondary-btn: #cbd5e1;
            --text-secondary-btn: #334155;
            --bg-primary-btn: #0f172a;
            --text-primary-btn: #ffffff;
            --bg-primary-btn-hover: #1e293b;
            --bg-range-box: #f1f5f9;
            --border-range-box: rgba(15, 23, 42, 0.1);
            
            --tag-bg: #cbd5e1;
            --tag-text: #0f172a;
            --tag-bg-d: #475569;
            --tag-text-d: #ffffff;

            /* 明亮畫布變數 */
            --canvas-bg: #f8fafc;
            --canvas-stroke: #cbd5e1;
            --canvas-wa-fill: rgba(15, 23, 42, 0.03);
            --canvas-wa-stroke: rgba(15, 23, 42, 0.3);
            --canvas-dash-stroke: rgba(15, 23, 42, 0.4);
            --canvas-d-dash-stroke: rgba(100, 116, 139, 0.3);
            --canvas-corner-fill: #94a3b8;
            --canvas-dot-fill: #0f172a;
            --canvas-text-fill: #0f172a;
            --canvas-machine-highlight: #ea580c;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-body);
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        canvas {
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.5);
            background-color: var(--canvas-bg);
            border: 1px solid var(--canvas-stroke);
            max-width: 100%;
            height: auto;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .panel-bg {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-panel);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .text-title {
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        .uniform-input {
            width: 100%;
            height: 32px;
            outline: none;
            text-align: center;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-weight: 700;
            background: var(--bg-input);
            color: var(--text-input);
            font-size: 13px;
            border: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .table-item {
            border: 1px solid var(--border-panel);
            background-color: var(--bg-row);
            transition: all 0.2s ease;
        }

        .table-item:hover {
            background-color: var(--bg-row-hover);
        }

        .table-item.active-row {
            background-color: var(--bg-active-row);
            border-left: 4px solid var(--border-active-row);
        }

        .item-text {
            color: var(--text-row-inactive);
            font-weight: 700;
            transition: color 0.3s ease;
        }

        .table-item.active-row .item-text {
            color: var(--text-row-active);
        }

        .tag-label {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            background-color: var(--tag-bg);
            color: var(--tag-text);
            font-size: 11px;
            font-weight: 900;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .tag-label-d {
            background-color: var(--tag-bg-d);
            color: var(--tag-text-d);
        }

        /* 輸入欄位右側的單位標示 */
        .unit-label {
            display: flex;
            align-items: center;
            padding: 0 8px;
            background: var(--bg-input);
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .input-card .uniform-input {
            min-width: 0;
        }

        .input-card {
            border: 1px solid var(--border-input);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            background: var(--bg-panel);
            transition: border-color 0.3s ease, background-color 0.3s ease;
        }

        .custom-border {
            border: 2px solid var(--border-input);
            transition: border-color 0.3s ease;
        }

        .btn-custom-secondary {
            background-color: var(--bg-secondary-btn);
            border-color: var(--border-secondary-btn);
            color: var(--text-secondary-btn);
            transition: all 0.2s ease;
        }

        .btn-custom-secondary:hover {
            background-color: var(--bg-row-hover);
        }

        .btn-custom-primary {
            background-color: var(--bg-primary-btn);
            color: var(--text-primary-btn);
            transition: all 0.2s ease;
        }

        .btn-custom-primary:hover {
            background-color: var(--bg-primary-btn-hover);
            opacity: 0.9;
        }

        .range-box {
            background-color: var(--bg-range-box);
            border-color: var(--border-range-box);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .text-muted-custom {
            color: var(--text-muted);
            transition: color 0.3s ease;
        }

        .bg-input-custom {
            background-color: var(--bg-input);
            transition: background-color 0.3s ease;
        }

        .border-input-custom {
            border-color: var(--border-input);
            transition: border-color 0.3s ease;
        }

        .text-custom {
            color: var(--text-input);
            transition: color 0.3s ease;
        }

        /* 進階功能：沒有開啟進階模式時隱藏（與轉檔工具共用同一個開關） */
        body:not(.show-advanced) [data-advanced] { display: none !important; }

        /* 捲軸美化 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-body);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-panel);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">

</head>
<body class="p-2 md:p-8">
    <div class="max-w-7xl mx-auto">
        <!-- 改良為深灰色主題的高質感 Header -->
        <header class="mb-4 md:mb-6 bg-gradient-to-r from-neutral-800 via-slate-900 to-zinc-900 p-6 text-white flex justify-between items-center rounded-xl border border-neutral-700/50 shadow-lg">
            <div>
                <h1 id="ui-title" class="text-xl md:text-2xl font-black tracking-tight text-white">桌長配置產生器</h1>
            </div>
            <div class="flex gap-2 md:gap-3 items-center shrink-0">
                <!-- 返回上一頁按鈕 -->
                <button onclick="if(window.history.length > 1) { window.history.back(); } else { window.location.href='index.html'; }" class="flex items-center justify-center text-slate-300 hover:text-orange-400 transition-colors font-bold bg-white/10 hover:bg-white/20 p-1.5 rounded-lg border border-white/20 cursor-pointer" title="返回上一頁 / Go Back">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <line x1="20" y1="12" x2="4" y2="12"></line>
                        <polyline points="10 18 4 12 10 6"></polyline>
                    </svg>
                </button>
                <!-- 主題切換 (太陽/月亮描邊圖示，無任何文字) -->
                <button id="theme-toggle-btn" onclick="toggleTheme()" class="p-2 rounded-lg bg-white/10 hover:bg-white/20 text-white border border-white/10 transition-all flex items-center justify-center animate-pulse-slow" aria-label="Toggle Theme">
                    <svg id="theme-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <!-- SVG path 由 JS 動態注入 -->
                    </svg>
                </button>
                <!-- 進階功能開關 -->
                <button id="advanced-toggle" onclick="setAdvanced(!document.body.classList.contains('show-advanced'))" class="px-3 py-1.5 rounded-lg text-[13px] font-bold border transition-all"></button>
                <!-- 語言切換 -->
                <button onclick="toggleLang()" class="whitespace-nowrap px-3 md:px-4 py-1.5 rounded-lg text-[13px] font-bold bg-white/10 hover:bg-white/20 text-white border border-white/10 transition-all flex items-center justify-center gap-2">
                    <span>中文 / EN</span>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6">
            <!-- 左側繪圖與數值輸入區 -->
            <div class="lg:col-span-2 flex flex-col gap-4">
                <div id="canvas-container" class="relative panel-bg p-3 md:p-4 rounded-xl shadow-xl flex flex-col items-center justify-center overflow-hidden min-h-[300px]">
                    <!-- 機器方向圖例 -->
                    <div class="w-full flex flex-wrap items-center justify-end gap-x-4 gap-y-1 mb-2 text-[11px] font-bold text-muted-custom">
                        <span class="flex items-center gap-1.5"><span class="inline-block w-3 h-3 rounded-full border-2 border-orange-600"></span><span id="legend-center">機器中心</span></span>
                        <span class="flex items-center gap-1.5"><span class="inline-block w-3 h-3 rounded-full bg-slate-300 border border-slate-500"></span><span id="legend-front">機器前側</span></span>
                        <span class="flex items-center gap-1.5 text-orange-500"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="12" y1="4" x2="12" y2="20"></line><polyline points="6 14 12 20 18 14"></polyline></svg><span id="legend-facing">前側朝向 S 邊放置</span></span>
                    </div>
                    <canvas id="tableCanvas"></canvas>
                </div>
                
                <!-- 固定位置的輸入面板 -->
                <div class="panel-bg p-4 rounded-xl shadow-lg">
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
                        <div class="flex flex-col gap-1">
                            <span id="label-n" class="text-[10px] text-muted-custom font-bold ml-1 uppercase">側邊N</span>
                            <div class="input-card">
                                <span class="tag-label">N</span>
                                <input type="number" id="valN" min="600" max="2600" class="uniform-input" oninput="updateCurrentTableData(false)" onblur="updateCurrentTableData(true)">
                                <span class="unit-label">mm</span>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <span id="label-s" class="text-[10px] text-muted-custom font-bold ml-1 uppercase">側邊S</span>
                            <div class="input-card">
                                <span class="tag-label">S</span>
                                <input type="number" id="valS" min="600" max="2600" class="uniform-input" oninput="updateCurrentTableData(false)" onblur="updateCurrentTableData(true)">
                                <span class="unit-label">mm</span>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <span id="label-w" class="text-[10px] text-muted-custom font-bold ml-1 uppercase">側邊W</span>
                            <div class="input-card">
                                <span class="tag-label">W</span>
                                <input type="number" id="valW" min="600" max="2600" class="uniform-input" oninput="updateCurrentTableData(false)" onblur="updateCurrentTableData(true)">
                                <span class="unit-label">mm</span>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <span id="label-e" class="text-[10px] text-muted-custom font-bold ml-1 uppercase">側邊E</span>
                            <div class="input-card">
                                <span class="tag-label">E</span>
                                <input type="number" id="valE" min="600" max="2600" class="uniform-input" oninput="updateCurrentTableData(false)" onblur="updateCurrentTableData(true)">
                                <span class="unit-label">mm</span>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <span id="label-d" class="text-[10px] text-muted-custom font-bold ml-1 uppercase">對角D</span>
                            <div class="input-card">
                                <span class="tag-label tag-label-d">D</span>
                                <input type="number" id="valD" max="2990" class="uniform-input" oninput="updateCurrentTableData(false)" onblur="updateCurrentTableData(true)">
                                <span class="unit-label">mm</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 鬆緊修正：機器放出的皮帶比實際長，table.cfg 的四邊要扣掉；上面填捲尺實際量到的值 -->
                    <div class="mt-4 grid grid-cols-1 sm:grid-cols-[180px_1fr] gap-3 items-start">
                        <div class="flex flex-col gap-1">
                            <span id="label-c" class="text-[10px] text-muted-custom font-bold ml-1 uppercase"></span>
                            <div class="input-card">
                                <span class="tag-label">C</span>
                                <input type="number" id="valC" min="0" max="100" step="0.5" class="uniform-input" oninput="updateCurrentTableData(false)">
                                <span class="unit-label">mm</span>
                            </div>
                        </div>
                        <div class="text-[11px] text-muted-custom space-y-1">
                            <p id="c-desc"></p>
                            <p id="c-out" class="font-mono text-title"></p>
                            <div class="flex flex-wrap items-center gap-2">
                                <button id="c-apply" onclick="applySlack()" class="btn-custom-secondary border px-3 py-1 rounded-lg text-xs font-bold"></button>
                                <span id="c-warn" class="text-amber-500 font-bold"></span>
                            </div>
                        </div>
                    </div>
                    <p id="limit-warn" class="hidden mt-3 text-[11px] font-bold text-red-500"></p>

                    <!-- 尺寸比例校正：畫一個已知尺寸的框、量實際尺寸，自動算出比例 X / Y -->
                    <div class="mt-6 pt-4 border-t border-slate-700/50">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <div>
                                <div id="cal-title" class="text-sm font-bold text-title">尺寸比例校正</div>
                                <div id="cal-status" class="text-[11px] text-muted-custom font-mono mt-0.5"></div>
                            </div>
                            <button id="cal-toggle" onclick="toggleCal()" class="btn-custom-secondary border px-3 py-1.5 rounded-lg text-xs font-bold"></button>
                        </div>

                        <div id="cal-panel" class="hidden mt-4 space-y-4 text-xs">
                            <div class="p-3 rounded-lg range-box border">
                                <div class="font-bold text-title mb-1" id="cal-s1"></div>
                                <p class="text-muted-custom mb-2" id="cal-s1-desc"></p>
                                <div class="grid grid-cols-2 gap-2">
                                    <div class="input-card"><span class="tag-label">W</span><input type="number" id="cal-w" class="uniform-input" step="10" oninput="renderCal()"><span class="unit-label">mm</span></div>
                                    <div class="input-card"><span class="tag-label">H</span><input type="number" id="cal-h" class="uniform-input" step="10" oninput="renderCal()"><span class="unit-label">mm</span></div>
                                </div>
                                <p class="text-[11px] text-muted-custom mt-1 font-mono" id="cal-limit"></p>
                                <p class="text-[11px] font-bold text-amber-500 mt-1" id="cal-baseline"></p>
                                <button onclick="downloadCalFrame()" id="cal-download" class="mt-2 w-full btn-custom-primary font-bold py-2 rounded-lg disabled:opacity-40 disabled:cursor-not-allowed"></button>
                            </div>

                            <div class="p-3 rounded-lg range-box border">
                                <div class="font-bold text-title mb-1" id="cal-s2"></div>
                                <p class="text-muted-custom mb-2" id="cal-s2-desc"></p>
                                <div class="grid grid-cols-2 gap-2">
                                    <div class="input-card"><span class="tag-label">X</span><input type="number" id="cal-mx" class="uniform-input" step="0.1" placeholder="—" oninput="renderCal()"><span class="unit-label">mm</span></div>
                                    <div class="input-card"><span class="tag-label">Y</span><input type="number" id="cal-my" class="uniform-input" step="0.1" placeholder="—" oninput="renderCal()"><span class="unit-label">mm</span></div>
                                </div>
                            </div>

                            <div class="p-3 rounded-lg range-box border">
                                <div class="font-bold text-title mb-1" id="cal-s3"></div>
                                <div id="cal-result" class="font-mono text-custom leading-relaxed"></div>
                                <div id="cal-warn" class="hidden mt-1 text-[11px] font-bold text-amber-500"></div>
                                <button onclick="applyCal()" id="cal-apply" class="mt-2 w-full btn-custom-primary font-bold py-2 rounded-lg disabled:opacity-40 disabled:cursor-not-allowed"></button>
                                <p class="text-[11px] font-bold text-green-500 mt-2 hidden" id="cal-done"></p>
                            </div>
                        </div>

                        <!-- 進階：直接輸入比例數值 -->
                        <div data-advanced class="grid grid-cols-2 gap-4 mt-4">
                            <div>
                                <label id="ui-scaleX" class="block text-[10px] md:text-xs font-bold text-muted-custom uppercase mb-1">Scale X</label>
                                <input type="number" id="valX" step="0.0001" class="w-full bg-input-custom border border-input-custom p-2 rounded font-mono text-custom outline-none focus:ring-2 focus:ring-slate-500" oninput="updateCurrentTableData(false)">
                            </div>
                            <div>
                                <label id="ui-scaleY" class="block text-[10px] md:text-xs font-bold text-muted-custom uppercase mb-1">Scale Y</label>
                                <input type="number" id="valY" step="0.0001" class="w-full bg-input-custom border border-input-custom p-2 rounded font-mono text-custom outline-none focus:ring-2 focus:ring-slate-500" oninput="updateCurrentTableData(false)">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右側控制 -->
            <div class="panel-bg p-4 md:p-6 rounded-xl shadow-xl flex flex-col">
                <h3 id="ui-list-title" class="text-lg font-bold mb-4 text-title flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400" viewBox="0 0 20 20" fill="currentColor"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"/></svg>
                    TABLE 數據列表
                </h3>
                
                <div class="flex-1 overflow-y-auto space-y-2 mb-6 max-h-[300px] lg:max-h-none" id="tableList"></div>

                <div class="space-y-4">
                    <div class="p-3 md:p-4 range-box rounded-lg border">
                        <p id="ui-range-label" class="font-bold text-xs text-muted-custom mb-2">加工座標範圍 (±X, ±Y) mm：</p>
                        <div id="wa-info" class="text-center font-bold text-lg md:text-xl text-custom bg-input-custom p-3 rounded-lg shadow-inner border border-input-custom"></div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-1 gap-2">
                        <button onclick="document.getElementById('fileInput').click()" class="w-full btn-custom-secondary font-bold py-3 px-4 rounded-xl border shadow-md flex items-center justify-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                            <span id="ui-upload-btn">上傳 table.cfg</span>
                        </button>
                        <input type="file" id="fileInput" class="hidden" accept=".cfg" onchange="handleFileUpload(event)">
                        
                        <button onclick="downloadAll()" class="w-full btn-custom-primary font-bold py-3 px-4 rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                            <span id="ui-download-btn">下載 table.cfg</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="gordix-table.js?v=10"></script>
    <script>
        const canvas = document.getElementById('tableCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        
        let currentLang = 'zh';
        let currentTheme = 'dark'; // 預設深色模式

        const i18n = {

                calLimit: "這個表格的加工範圍最大可畫 {w} × {h} mm",
                calTooBig: "⚠ 框超出加工範圍，請縮小",

                calS3: "③ 計算並套用",

            },
            en: {
                title: "Table Configurator",
                scaleX: "Scale X",
                scaleY: "Scale Y",
                listTitle: "TABLE Data List",

                upload: "Upload table.cfg",

                sideN: "Side N",
                sideS: "Side S",
                sideW: "Side W",
                sideE: "Side E",
                sideD: "Diagonal D",
                sideC: "Slack correction",
                cDesc: "The machine pays out a bit more belt than needed, so the sides in table.cfg must be reduced by that length. Enter the actual tape measurements above; the correction is subtracted on download and D is recomputed at the same angle (no skew).",
                cOut: "Written to table.cfg: N {N} · S {S} · W {W} · E {E} · D {D}",
                cApply: "Use the measured value {v} mm",
                cWarn: "⚠ If you already reduced the sides by hand, change them back to the tape measurements first, or it will be subtracted twice.",
                limitWarn: "⚠ At the machine limit: sides in table.cfg can be at most 2600 mm and the diagonal 2990 mm (after slack correction). Larger values were limited; if the real size is bigger the conversion will be off. Check the jig positions or ask the manufacturer.",
                advancedOff: "Advanced",
                advancedOn: "Advanced ✓",
                calTitle: "Size Scale Calibration",
                calStatus: "Table {t} · Scale X {x} · Y {y}",
                calUncal: " (not calibrated)",
                calDoneTag: " (calibrated)",
                calOpen: "Calibrate",
                calClose: "Close",
                calS1: "① Draw the calibration frame",
                calS1Desc: "Run it with the laser or pen module. It draws a rectangle at the machine center; the corner lines extend 15 mm to form crosses for easy measuring. Bigger is more accurate, but stay inside the work range.",
                calLimit: "Largest frame for this table's work range: {w} × {h} mm",
                calTooBig: "⚠ Frame exceeds the work range, make it smaller",
                calBaseline: "When drawing, table.cfg on the SD card must contain the current scales (X {x}, Y {y}) for the result to be correct.",
                calDownload: "Download calibration G-code",
                calS2: "② Measure the real size",
                calS2Desc: "Along the horizontal line of the center cross, measure between the left and right lines (X); along the vertical line, between the top and bottom lines (Y). Measure the same edge of each line.",
                calS3: "③ Calculate and apply",
                calNeed: "Enter both measurements to see the result",
                calResult: "X: design {dw} / measured {mw} → {ox} × {rx} = {nx}\nY: design {dh} / measured {mh} → {oy} × {ry} = {ny}",
                calWarn: "⚠ Error exceeds 3%. Check the measurements and that they are in mm",
                calApply: "Apply to Table {t}",
                calApplied: "Applied. Click \"Download table.cfg\", copy it to the SD card and reselect this table on the machine. Recalibrate after changing the machine or belts.",
                legendCenter: "Machine center",
                legendFront: "Machine front",
                legendFacing: "Front faces side S",
                canvasFront: "FRONT"
            }
        };

        // 預設配置符合 600 ~ 2600 限制（複製一份，避免改到共用的預設值）
        let allTables = JSON.parse(JSON.stringify(GordixTable.DEFAULTS));

        let currentTableId = 1;

        // 統一的主題渲染與套用邏輯
        function applyTheme(theme) {
            const themeIcon = document.getElementById('theme-icon');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.body.classList.remove('theme-light');
                if (themeIcon) {
                    // Sun 圖示 (點擊變亮)
                    themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z" />`;
                }
                localStorage.setItem('gordix-theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                document.body.classList.add('theme-light');
                if (themeIcon) {
                    // Moon 圖示 (點擊變暗)
                    themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />`;
                }
                localStorage.setItem('gordix-theme', 'light');
            }
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(currentTheme);
            draw();
        }

        function toggleLang() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            localStorage.setItem('gordix-lang', currentLang);
            updateUI();
            draw(); // 畫布上的方向文字也要換語言
        }

        function updateUI() {
            const t = i18n[currentLang];
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('ui-scaleX').innerText = t.scaleX;
            document.getElementById('ui-scaleY').innerText = t.scaleY;
            document.getElementById('ui-range-label').innerText = t.rangeLabel;
            document.getElementById('ui-list-title').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400" viewBox="0 0 20 20" fill="currentColor"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"/></svg> ${t.listTitle}`;
            document.getElementById('ui-download-btn').innerText = t.download;
            document.getElementById('ui-upload-btn').innerText = t.upload;
            
            // 更新輸入面板標籤
            document.getElementById('label-n').innerText = t.sideN;
            document.getElementById('label-s').innerText = t.sideS;
            document.getElementById('label-w').innerText = t.sideW;
            document.getElementById('label-e').innerText = t.sideE;
            document.getElementById('label-d').innerText = t.sideD;
            document.getElementById('label-c').innerText = t.sideC;
            document.getElementById('c-desc').innerText = t.cDesc;
            document.getElementById('c-warn').innerText = t.cWarn;
            document.getElementById('limit-warn').innerText = t.limitWarn;
            renderSlack();
            document.getElementById('legend-center').innerText = t.legendCenter;
            document.getElementById('legend-front').innerText = t.legendFront;
            document.getElementById('legend-facing').innerText = t.legendFacing;
            [['cal-title', 'calTitle'], ['cal-s1', 'calS1'], ['cal-s1-desc', 'calS1Desc'], ['cal-download', 'calDownload'],
             ['cal-s2', 'calS2'], ['cal-s2-desc', 'calS2Desc'], ['cal-s3', 'calS3'], ['cal-done', 'calApplied']]
                .forEach(([id, key]) => { document.getElementById(id).innerText = t[key]; });

            // 確保主題圖示與類別套用正確
            applyTheme(currentTheme);

            renderTableList();
            renderAdvancedState();
        }

        const ADVANCED_KEY = 'gordix-advanced';

        function setAdvanced(on) {
            document.body.classList.toggle('show-advanced', on);
            try { localStorage.setItem(ADVANCED_KEY, on ? '1' : '0'); } catch (e) { }
            renderAdvancedState();
        }

        function renderAdvancedState() {
            const t = i18n[currentLang];
            const on = document.body.classList.contains('show-advanced');
            const btn = document.getElementById('advanced-toggle');
            btn.innerText = on ? t.advancedOn : t.advancedOff;
            btn.className = 'whitespace-nowrap px-3 py-1.5 rounded-lg text-[13px] font-bold border transition-all ' +
                (on ? 'bg-violet-500 border-violet-300 text-white' : 'bg-white/10 hover:bg-white/20 border-white/10 text-white');
            renderCal();
        }

        // ===== 尺寸比例校正 =====
        // 機器韌體以 table.cfg 的比例縮放座標；畫框時已套用舊比例，所以新比例 = 舊比例 × 設計尺寸 ÷ 實測尺寸
        const CAL_OVERSHOOT = 15; // 角落線條延伸成十字的長度 (mm)
        const fmt4 = v => (Math.round(v * 10000) / 10000).toFixed(4);

        // 加工範圍內可畫的最大框（扣掉十字延伸），並給一個取整的預設值
        function calLimits() {
            const r = GordixTable.workRange(allTables[currentTableId]);
            return { w: (r.x - CAL_OVERSHOOT) * 2, h: (r.y - CAL_OVERSHOOT) * 2 };
        }

        function toggleCal() {
            const panel = document.getElementById('cal-panel');
            panel.classList.toggle('hidden');
            if (!panel.classList.contains('hidden') && !document.getElementById('cal-w').value) resetCalSize();
            renderCal();
        }

        function resetCalSize() {
            const lim = calLimits();
            document.getElementById('cal-w').value = Math.max(100, Math.floor(lim.w * 0.9 / 100) * 100);
            document.getElementById('cal-h').value = Math.max(100, Math.floor(lim.h * 0.9 / 100) * 100);
        }

        function calValues() {
            const num = id => parseFloat(document.getElementById(id).value);
            const d = allTables[currentTableId];
            const v = { w: num('cal-w'), h: num('cal-h'), mx: num('cal-mx'), my: num('cal-my'), ox: d.X || 1, oy: d.Y || 1 };
            v.ready = v.w > 0 && v.h > 0 && v.mx > 0 && v.my > 0;
            if (v.ready) {
                v.rx = v.w / v.mx; v.ry = v.h / v.my;
                v.nx = v.ox * v.rx; v.ny = v.oy * v.ry;
            }
            return v;
        }

        function renderCal() {
            const t = i18n[currentLang], d = allTables[currentTableId];
            const calibrated = d.X !== 1 || d.Y !== 1;
            document.getElementById('cal-status').innerText =
                t.calStatus.replace('{t}', currentTableId).replace('{x}', fmt4(d.X || 1)).replace('{y}', fmt4(d.Y || 1)) + (calibrated ? t.calDoneTag : t.calUncal);
            const open = !document.getElementById('cal-panel').classList.contains('hidden');
            document.getElementById('cal-toggle').innerText = open ? t.calClose : t.calOpen;
            if (!open) return;

            const lim = calLimits(), v = calValues();
            const tooBig = v.w > lim.w || v.h > lim.h;
            const limitEl = document.getElementById('cal-limit');
            limitEl.innerText = tooBig ? t.calTooBig : t.calLimit.replace('{w}', Math.floor(lim.w)).replace('{h}', Math.floor(lim.h));
            limitEl.className = 'text-[11px] mt-1 font-mono ' + (tooBig ? 'text-amber-500 font-bold' : 'text-muted-custom');
            document.getElementById('cal-download').disabled = tooBig || !(v.w > 0 && v.h > 0);
            document.getElementById('cal-baseline').innerText = t.calBaseline.replace('{x}', fmt4(v.ox)).replace('{y}', fmt4(v.oy));

            const result = document.getElementById('cal-result');
            const warn = document.getElementById('cal-warn');
            const apply = document.getElementById('cal-apply');
            apply.innerText = t.calApply.replace('{t}', currentTableId);
            if (!v.ready) {
                result.innerText = t.calNeed;
                warn.classList.add('hidden');
                apply.disabled = true;
                return;
            }
            result.innerText = t.calResult
                .replace('{dw}', v.w).replace('{mw}', v.mx).replace('{ox}', fmt4(v.ox)).replace('{rx}', v.rx.toFixed(5)).replace('{nx}', fmt4(v.nx))
                .replace('{dh}', v.h).replace('{mh}', v.my).replace('{oy}', fmt4(v.oy)).replace('{ry}', v.ry.toFixed(5)).replace('{ny}', fmt4(v.ny));
            warn.innerText = t.calWarn;
            warn.classList.toggle('hidden', Math.abs(v.rx - 1) <= 0.03 && Math.abs(v.ry - 1) <= 0.03);
            apply.disabled = false;
            document.getElementById('cal-done').classList.add('hidden'); // 輸入了新的實測值，上次的套用提示不再適用
        }

        function applyCal() {
            const v = calValues();
            if (!v.ready) return;
            document.getElementById('valX').value = fmt4(v.nx);
            document.getElementById('valY').value = fmt4(v.ny);
            updateCurrentTableData(false);
            // 新比例已套用，舊的實測值不再對應，清掉避免重複套用
            document.getElementById('cal-mx').value = '';
            document.getElementById('cal-my').value = '';
            renderCal();
            document.getElementById('cal-done').classList.remove('hidden');
        }

        // 校正框 G-code：格式與繪圖工具的雷射 / 畫筆輸出相同（M03 開、M05 關），中心在機器原點
        function downloadCalFrame() {
            const v = calValues(), hw = v.w / 2, hh = v.h / 2, o = CAL_OVERSHOOT, f = n => n.toFixed(3);
            const strokes = [
                [[-10, 0], [10, 0]], [[0, -10], [0, 10]],                 // 中心十字
                [[-hw - o, hh], [hw + o, hh]], [[-hw - o, -hh], [hw + o, -hh]], // 上下兩條
                [[-hw, -hh - o], [-hw, hh + o]], [[hw, -hh - o], [hw, hh + o]]  // 左右兩條
            ];
            const g = [
                `(Gordix scale calibration frame: ${v.w} x ${v.h} mm, centered at machine origin)`,
                `(Table ${currentTableId}, scale at drawing time: X ${fmt4(v.ox)} Y ${fmt4(v.oy)})`,
                '(Measure between the left/right lines for X and the top/bottom lines for Y)',
                'G21', 'G90', 'G1 F1500'
            ];
            strokes.forEach(([a, b]) => {
                g.push(`G0 X${f(a[0])} Y${f(a[1])}`, 'M03 S255', `G1 X${f(b[0])} Y${f(b[1])}`, 'M05');
            });
            g.push('G0 X0 Y0');
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([g.join('\n')], { type: 'text/plain' }));
            a.download = `calibration_${v.w}x${v.h}.gcode`;
            a.click();
        }

        function renderTableList() {
            const list = document.getElementById('tableList');
            const t = i18n[currentLang];
            list.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                const item = document.createElement('div');
                item.className = `p-3 rounded-lg cursor-pointer transition-all table-item ${currentTableId == i ? 'active-row shadow-lg' : ''}`;
                item.onclick = () => switchTable(i);
                item.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="item-text">${t.table} ${i}</span>
                        <div class="text-right">
                             <div class="text-[10px] font-mono text-muted-custom">S: ${allTables[i].S} W: ${allTables[i].W}</div>
                             <div class="text-[10px] font-mono text-muted-custom">D: ${allTables[i].D}</div>
                        </div>
                    </div>
                `;
                list.appendChild(item);
            }
        }

        function switchTable(id) {
            currentTableId = id;
            const data = allTables[id];
            document.getElementById('valN').value = data.N;
            document.getElementById('valS').value = data.S;
            document.getElementById('valW').value = data.W;
            document.getElementById('valE').value = data.E;
            document.getElementById('valD').value = data.D;
            document.getElementById('valX').value = data.X;
            document.getElementById('valY').value = data.Y;
            document.getElementById('valC').value = data.C || 0;
            updateCurrentTableData(false);   // 更新上限提示與鬆緊修正的輸出值
            draw();
            renderAdvancedState();
            GordixTable.save(allTables, currentTableId);
        }

        function updateCurrentTableData(forceMin = false) {
            const nInput = document.getElementById('valN');
            const sInput = document.getElementById('valS');
            const wInput = document.getElementById('valW');
            const eInput = document.getElementById('valE');
            const dInput = document.getElementById('valD');

            let nVal = parseFloat(nInput.value) || 0;
            let sVal = parseFloat(sInput.value) || 0;
            let wVal = parseFloat(wInput.value) || 0;
            let eVal = parseFloat(eInput.value) || 0;
            let dVal = parseFloat(dInput.value) || 0;
            const cVal = Math.max(0, parseFloat(document.getElementById('valC').value) || 0);

            // 機器上限是寫進 table.cfg 的值（扣除鬆緊修正後）：四邊 2600、對角線 2990（對角線約多扣 1.5 倍）
            const sideMax = 2600 + cVal, dMax = 2990 + cVal * 1.5;
            const cap = (v, max, input) => { if (v > max) { input.value = max; return max; } return v; };
            nVal = cap(nVal, sideMax, nInput); sVal = cap(sVal, sideMax, sInput);
            wVal = cap(wVal, sideMax, wInput); eVal = cap(eVal, sideMax, eInput);
            dVal = cap(dVal, dMax, dInput);
            // 停在上限就一直提示（被限制過的值看起來和正常值一樣，不提示就會默默算錯）
            const atLimit = [nVal, sVal, wVal, eVal].some(v => v >= sideMax) || dVal >= dMax;
            document.getElementById('limit-warn').classList.toggle('hidden', !atLimit);

            // 失焦或強制補正下限值 (最小 600)
            if (forceMin) {
                if (nVal < 600 && nInput.value !== "") { nVal = 600; nInput.value = 600; }
                if (sVal < 600 && sInput.value !== "") { sVal = 600; sInput.value = 600; }
                if (wVal < 600 && wInput.value !== "") { wVal = 600; wInput.value = 600; }
                if (eVal < 600 && eInput.value !== "") { eVal = 600; eInput.value = 600; }
            }

            allTables[currentTableId] = {
                N: nVal,
                S: sVal,
                W: wVal,
                E: eVal,
                D: dVal,
                X: parseFloat(document.getElementById('valX').value) || 0,
                Y: parseFloat(document.getElementById('valY').value) || 0,
                C: cVal
            };
            renderTableList();
            draw();
            renderCal();
            renderSlack();
            GordixTable.save(allTables, currentTableId);
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const lines = e.target.result.split(/\r?\n/);
                const regex = /TABLE(\d+)([ESWNDXY])\s+([\d.]+)/i;
                lines.forEach(line => {
                    const match = line.trim().match(regex);
                    if (match) {
                        const id = parseInt(match[1]);
                        const key = match[2].toUpperCase();
                        let val = parseFloat(match[3]);

                        // 確保匯入的數據也符合限制
                        if (['E', 'S', 'W', 'N'].includes(key)) {
                            if (val < 600) val = 600;
                            if (val > 2600) val = 2600;
                        } else if (key === 'D') {
                            if (val > 2990) val = 2990;
                        }

                        if (allTables[id]) allTables[id][key] = val;
                    }
                });
                // table.cfg 裡是扣過鬆緊修正的值，加回來才是捲尺量到的值
                Object.keys(allTables).forEach(id => {
                    const c = allTables[id].C || 0;
                    if (c) allTables[id] = Object.assign(GordixTable.shrinkTable(allTables[id], -c), { C: c });
                });
                switchTable(currentTableId);
                event.target.value = ''; 
            };
            reader.readAsText(file);
        }

        function draw() {
            const containerWidth = container.clientWidth;
            const baseWidth = 750;
            const baseHeight = 500;
            const ratio = baseHeight / baseWidth;
            
            canvas.width = containerWidth;
            canvas.height = containerWidth * ratio;

            const w = canvas.width;
            const h = canvas.height;
            const d = allTables[currentTableId];

            // 動態讀取當前主題的 CSS 變數做為繪圖顏色
            const style = getComputedStyle(document.body);
            const canvasBg = style.getPropertyValue('--canvas-bg').trim();
            const canvasStroke = style.getPropertyValue('--canvas-stroke').trim();
            const canvasWaFill = style.getPropertyValue('--canvas-wa-fill').trim();
            const canvasWaStroke = style.getPropertyValue('--canvas-wa-stroke').trim();
            const canvasDashStroke = style.getPropertyValue('--canvas-dash-stroke').trim();
            const canvasDDashStroke = style.getPropertyValue('--canvas-d-dash-stroke').trim();
            const canvasCornerFill = style.getPropertyValue('--canvas-corner-fill').trim();
            const canvasDotFill = style.getPropertyValue('--canvas-dot-fill').trim();
            const canvasTextFill = style.getPropertyValue('--canvas-text-fill').trim();
            const canvasMachineHighlight = style.getPropertyValue('--canvas-machine-highlight').trim();

            const maxVal = Math.max(d.S, d.N, d.W, d.E, d.D);
            const scale = (w * 0.8) / (maxVal || 1); 

            let cosTheta = (Math.pow(d.W, 2) + Math.pow(d.S, 2) - Math.pow(d.D, 2)) / (2 * d.W * d.S || 1);
            cosTheta = Math.max(-1, Math.min(1, cosTheta)); 
            const theta = Math.acos(cosTheta);

            const pBL = { x: 0, y: 0 };
            const pBR = { x: d.S * scale, y: 0 };
            const pTL = { 
                x: d.W * scale * Math.cos(theta), 
                y: -d.W * scale * Math.sin(theta) 
            };

            const dx = pBR.x - pTL.x;
            const dy = pBR.y - pTL.y;
            const angleD = Math.atan2(dy, dx);

            let cosPhi = (Math.pow(d.N, 2) + Math.pow(d.D, 2) - Math.pow(d.E, 2)) / (2 * d.N * d.D || 1);
            cosPhi = Math.max(-1, Math.min(1, cosPhi));
            const phi = Math.acos(cosPhi);

            const pTR = {
                x: pTL.x + d.N * scale * Math.cos(angleD - phi),
                y: pTL.y + d.N * scale * Math.sin(angleD - phi)
            };

            const minX = Math.min(pBL.x, pBR.x, pTL.x, pTR.x);
            const maxX = Math.max(pBL.x, pBR.x, pTL.x, pTR.x);
            const minY = Math.min(pBL.y, pBR.y, pTL.y, pTR.y);
            const maxY = Math.max(pBL.y, pBR.y, pTL.y, pTR.y);

            const offsetX = (w - (maxX - minX)) / 2 - minX;
            const offsetY = (h - (maxY - minY)) / 2 - minY;

            const pts = {
                BL: { x: pBL.x + offsetX, y: pBL.y + offsetY },
                BR: { x: pBR.x + offsetX, y: pBR.y + offsetY },
                TL: { x: pTL.x + offsetX, y: pTL.y + offsetY },
                TR: { x: pTR.x + offsetX, y: pTR.y + offsetY }
            };

            const centerX = (pts.TL.x + pts.BR.x) / 2;
            const centerY = (pts.TL.y + pts.BR.y) / 2;

            ctx.clearRect(0, 0, w, h);

            // 繪製桌面背景
            ctx.fillStyle = canvasBg;
            ctx.beginPath();
            ctx.moveTo(pts.TL.x, pts.TL.y); 
            ctx.lineTo(pts.TR.x, pts.TR.y);
            ctx.lineTo(pts.BR.x, pts.BR.y); 
            ctx.lineTo(pts.BL.x, pts.BL.y);
            ctx.closePath(); 
            ctx.fill();
            ctx.strokeStyle = canvasStroke; ctx.lineWidth = 2; ctx.stroke();

            // 加工範圍計算
            const range = GordixTable.workRange(d);
            const xDisp = range.x;
            const yDisp = range.y;

            const pxLeft  = -xDisp * scale;
            const pxRight = xDisp * scale;
            const pxUp    = yDisp * scale;
            const pxDown  = -yDisp * scale;

            ctx.save();
            ctx.fillStyle = canvasWaFill;
            ctx.strokeStyle = canvasWaStroke;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.rect(centerX + pxLeft, centerY - pxUp, pxRight - pxLeft, pxUp - pxDown);
            ctx.fill();
            ctx.stroke();

            // 在加工範圍方框內上方標註長與寬尺寸 (例如: 2280x1038)
            const waWidth = xDisp * 2;
            const waHeight = yDisp * 2;
            const dimText = `${waWidth}x${waHeight}`;
            
            // 字級跟著畫布縮放，手機上才不會超出加工範圍框
            const dimFont = Math.max(11, Math.round(20 * w / baseWidth));
            ctx.font = `bold ${dimFont}px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace`;
            const textWidth = ctx.measureText(dimText).width;
            const textX = centerX;
            const textY = centerY - pxUp + 6;

            // 半透明底塊，確保文字清楚不被背景圖案遮擋
            ctx.fillStyle = canvasBg;
            ctx.globalAlpha = 0.65;
            ctx.fillRect(textX - textWidth / 2 - 4, textY - 2, textWidth + 8, dimFont + 4);
            ctx.globalAlpha = 1.0;

            ctx.fillStyle = canvasTextFill;
            ctx.textAlign = "center";
            ctx.textBaseline = "top";
            ctx.fillText(dimText, textX, textY);

            ctx.restore();

            document.getElementById('wa-info').innerText = `(±${xDisp}, ±${yDisp})`;

            // 繪製線條
            ctx.save();
            ctx.setLineDash([8, 6]);
            ctx.strokeStyle = canvasDashStroke;
            ctx.lineWidth = Math.max(1.5, 2 * (w / baseWidth));
            line(pts.TL.x, pts.TL.y, pts.TR.x, pts.TR.y); // N
            line(pts.BL.x, pts.BL.y, pts.BR.x, pts.BR.y); // S
            line(pts.TL.x, pts.TL.y, pts.BL.x, pts.BL.y); // W
            line(pts.TR.x, pts.TR.y, pts.BR.x, pts.BR.y); // E
            ctx.strokeStyle = canvasDDashStroke;
            line(pts.TL.x, pts.TL.y, pts.BR.x, pts.BR.y); // D
            ctx.restore();

            // 繪製標註文字 (標示 N/S/W/E/D)
            ctx.fillStyle = canvasTextFill;
            ctx.font = "bold 12px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("N", (pts.TL.x + pts.TR.x) / 2, (pts.TL.y + pts.TR.y) / 2 - 10);
            ctx.fillText("S", (pts.BL.x + pts.BR.x) / 2, (pts.BL.y + pts.BR.y) / 2 + 20);
            ctx.fillText("W", (pts.TL.x + pts.BL.x) / 2 - 15, (pts.TL.y + pts.BL.y) / 2);
            ctx.fillText("E", (pts.TR.x + pts.BR.x) / 2 + 15, (pts.TR.y + pts.BR.y) / 2);
            
            // 對角線 D 的標籤
            ctx.save();
            ctx.fillStyle = canvasTextFill; 
            ctx.fillText("D", pts.TL.x * 0.75 + pts.BR.x * 0.25 + 10, pts.TL.y * 0.75 + pts.BR.y * 0.25 - 8);
            ctx.restore();

            drawCorner(pts.TL.x, pts.TL.y, 0, w/baseWidth, canvasCornerFill);
            drawCorner(pts.TR.x, pts.TR.y, Math.PI / 2, w/baseWidth, canvasCornerFill);
            drawCorner(pts.BR.x, pts.BR.y, Math.PI, w/baseWidth, canvasCornerFill);
            drawCorner(pts.BL.x, pts.BL.y, -Math.PI / 2, w/baseWidth, canvasCornerFill);

            ctx.fillStyle = canvasDotFill;
            Object.values(pts).forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, 4 * (w/baseWidth), 0, Math.PI * 2); ctx.fill();
            });

            drawMachine(centerX, centerY, w/baseWidth, canvasMachineHighlight);
            drawFrontArrow(centerX, centerY, (pts.BL.y + pts.BR.y) / 2, w/baseWidth, canvasMachineHighlight);
        }

        // 從機器前側（白點）畫箭頭指向 S 邊，標示機器應朝向的方向
        function drawFrontArrow(cx, cy, sEdgeY, s, color) {
            const y0 = cy + 28 * s;
            const y1 = Math.min(y0 + 70 * s, sEdgeY - 14 * s);
            if (y1 - y0 < 16 * s) return;

            ctx.save();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 3 * s;
            ctx.lineCap = 'round';
            line(cx, y0, cx, y1 - 8 * s);
            ctx.beginPath();
            ctx.moveTo(cx, y1);
            ctx.lineTo(cx - 7 * s, y1 - 11 * s);
            ctx.lineTo(cx + 7 * s, y1 - 11 * s);
            ctx.closePath();
            ctx.fill();

            ctx.font = `bold ${Math.round(13 * Math.max(s, 0.8))}px sans-serif`;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(i18n[currentLang].canvasFront, cx + 12 * s, (y0 + y1) / 2);
            ctx.restore();
        }

        function drawMachine(cx, cy, s, highlightColor) {
            ctx.save();
            ctx.translate(cx, cy); ctx.scale(s, s);
            ctx.fillStyle = '#000000';
            ctx.rotate(Math.PI / 4);
            ctx.fillRect(-33, -10, 66, 20); ctx.fillRect(-10, -33, 20, 66);
            ctx.rotate(-Math.PI / 4);
            ctx.fillRect(-7,-10,14,-15);
            ctx.strokeStyle = highlightColor; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = '#cbd5e1';
            ctx.beginPath(); ctx.arc(0, 15, 5, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function line(x1, y1, x2, y2) {
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        }

        function drawCorner(x, y, rot, s, cornerColor) {
            ctx.save();
            ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
            ctx.fillStyle = cornerColor || '#475569';
            ctx.beginPath(); 
            ctx.moveTo(0,0); ctx.lineTo(15,0); ctx.lineTo(15,5); ctx.lineTo(5,15); ctx.lineTo(0,15); 
            ctx.closePath(); ctx.fill(); 
            ctx.restore();
        }

        // 鬆緊修正：顯示實際寫進 table.cfg 的值
        function renderSlack() {
            const t = i18n[currentLang], d = allTables[currentTableId];
            const v = GordixTable.cfgValues(d);
            document.getElementById('c-out').innerText = t.cOut.replace('{N}', v.N).replace('{S}', v.S).replace('{W}', v.W).replace('{E}', v.E).replace('{D}', v.D);
            document.getElementById('c-apply').innerText = t.cApply.replace('{v}', GordixTable.SLACK_MEASURED);
            document.getElementById('c-apply').classList.toggle('hidden', (d.C || 0) === GordixTable.SLACK_MEASURED);
        }

        function applySlack() {
            document.getElementById('valC').value = GordixTable.SLACK_MEASURED;
            updateCurrentTableData(false);
        }

        function downloadAll() {
            // 寫進檔案的是扣除鬆緊修正後的值，再做機器上限檢查（四邊 600~2600、對角線 ≤ 2990）
            const lim = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
            let out = "";
            for (let i = 1; i <= 5; i++) {
                const d = GordixTable.cfgValues(allTables[i]);
                ['E', 'S', 'W', 'N'].forEach(k => { d[k] = lim(d[k], 600, 2600); });
                d.D = Math.min(d.D, 2990);
                out += `TABLE${i}E ${d.E}\nTABLE${i}S ${d.S}\nTABLE${i}W ${d.W}\nTABLE${i}N ${d.N}\nTABLE${i}D ${d.D}\nTABLE${i}X ${d.X.toFixed(4)}\nTABLE${i}Y ${d.Y.toFixed(4)}\n\n`;
            }
            const blob = new Blob([out], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'table.cfg'; a.click();
            // 記下交給機器的設定，首頁據此顯示「工作台已設定」
            GordixTable.markConfigured(allTables, currentTableId);
            URL.revokeObjectURL(url);
        }

        window.addEventListener('resize', draw);
        window.onload = () => {
            // 讀取並同步語系設定 (優先使用統一儲存鍵值 gordix-lang)
            const savedLang = localStorage.getItem('gordix-lang');
            if (savedLang === 'en' || savedLang === 'zh') {
                currentLang = savedLang;
            } else {
                currentLang = 'zh'; // 預設繁體中文
                localStorage.setItem('gordix-lang', 'zh');
            }

            // 讀取並同步主題設定 (優先使用統一儲存鍵值 gordix-theme)
            const savedTheme = localStorage.getItem('gordix-theme');
            if (savedTheme === 'light' || savedTheme === 'dark') {
                currentTheme = savedTheme;
            } else {
                currentTheme = 'dark'; // 預設深色模式
                localStorage.setItem('gordix-theme', 'dark');
            }

            try { document.body.classList.toggle('show-advanced', localStorage.getItem(ADVANCED_KEY) === '1'); } catch (e) { }

            // 載入上次的工作台設定，讓轉檔工具與這裡看到同一份資料
            const saved = GordixTable.load();
            if (saved) {
                Object.keys(allTables).forEach(id => {
                    if (saved.tables[id]) allTables[id] = saved.tables[id];
                });
            }

            updateUI(); 
            switchTable(saved && allTables[saved.currentId] ? saved.currentId : 1); 
        };
    </script>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then((reg) => console.log('Service Worker registered successfully with scope: ', reg.scope))
                    .catch((err) => console.error('Service Worker registration failed: ', err));
            });
        }
    </script>
