<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.min.js"></script>
    <style>
        html { overflow-y: scroll; }
        body:not(.show-advanced) [data-advanced] { display: none !important; }
        .card { border-radius: 0.75rem; border: 1px solid #e2e8f0; background: #f8fafc; padding: 1rem; }
        .dark .card { border-color: #1e293b; background: rgba(2, 6, 23, 0.5); }
        .label { font-size: 10px; font-weight: 900; letter-spacing: 0.08em; color: #64748b; }
        .dark .label { color: #94a3b8; }
        .num-field { display: flex; flex-direction: column; gap: 2px; font-size: 10px; font-weight: 700; color: #64748b; }
        .num-wrap { position: relative; display: block; }
        .num-wrap::after { content: attr(data-unit); position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 10px; color: #94a3b8; pointer-events: none; }
        .num-in { width: 100%; padding: 6px 30px 6px 8px; border-radius: 6px; outline: none; font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: #fff; border: 1px solid #cbd5e1; color: #1e293b; }
        select.num-in, input[type=text].num-in { padding-right: 8px; }
        .dark .num-in { background: #1e293b; border-color: #334155; color: #fff; }
        .num-in:disabled { opacity: 0.4; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        .seg { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; color: #64748b; }
        .seg.on { background: #f97316; color: #fff; }
        .row { border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; }
        .dark .row { border-color: #1e293b; }
        .row.active { border-color: #f97316; background: rgba(249, 115, 22, 0.08); }
        .btn { padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; }
        .btn-main { background: #f97316; color: #fff; }
        .btn-main:hover { background: #fb923c; }
        .btn-sub { background: rgba(148, 163, 184, 0.18); color: #334155; }
        .dark .btn-sub { color: #e2e8f0; }
        .btn-sub:hover { background: rgba(148, 163, 184, 0.3); }
        #preview-box { height: min(64vh, 680px); min-height: 360px; touch-action: none; }
        #ws text { font-family: ui-monospace, Consolas, monospace; user-select: none; }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen p-3 md:p-6 text-slate-800 dark:text-slate-200 font-sans">
<div class="max-w-[1600px] mx-auto bg-white dark:bg-slate-900 rounded-2xl shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-800">
    <!-- 頁首 -->
    <div class="bg-gradient-to-r from-orange-500 to-red-600 p-4 md:p-5 text-white flex justify-between items-center gap-3">
        <div>
            <div data-i18n="stepLabel" class="text-[11px] font-bold text-white/75"></div>
            <h1 data-i18n="title" class="text-lg md:text-2xl font-black"></h1>
        </div>
        <div class="flex gap-2 items-center shrink-0">
            <a href="index.html" class="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 border border-white/20" title="首頁 / Home">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="20" y1="12" x2="4" y2="12"/><polyline points="10 18 4 12 10 6"/></svg>
            </a>
            <button id="theme-toggle" class="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 border border-white/20" aria-label="Toggle Theme">
                <svg id="theme-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"></svg>
            </button>
            <button id="lang-toggle" class="px-3 py-1.5 rounded-lg text-[11px] font-bold bg-white/10 hover:bg-white/20 border border-white/20 whitespace-nowrap"></button>
            <button id="advanced-toggle" class="px-3 py-1.5 rounded-lg text-[11px] font-bold border border-white/20"></button>
            <a href="params.html" class="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 border border-white/20" title="參數指南 / Parameter guide">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            </a>
        </div>
    </div>

    <main class="grid grid-cols-1 xl:grid-cols-[300px_1fr_330px] gap-4 p-3 md:p-4">
        <!-- 左：檔案、毛胚、圖層、刀具庫 -->
        <div class="space-y-4 min-w-0">
            <section class="card space-y-2">
                <div data-i18n="secFile" class="label"></div>
                <input type="file" id="file-input" accept=".svg,.dxf,.png,.jpg,.jpeg,.bmp,.webp" class="hidden">
                <button id="btn-file" data-i18n="btnFile" class="btn btn-main w-full"></button>
                <div id="file-name" class="text-[11px] text-slate-500 truncate"></div>
                <div class="grid grid-cols-2 gap-2">
                    <label class="num-field col-span-2"><span data-i18n="targetW"></span><span class="num-wrap" data-unit="mm"><input type="number" id="target-width" class="num-in" min="1" step="0.1" value="100"></span></label>
                    <label id="threshold-row" class="num-field col-span-2 hidden"><span data-i18n="threshold"></span><input type="range" id="threshold" min="1" max="254" value="128" class="accent-orange-500"></label>
                    <label class="num-field col-span-2" data-advanced><span data-i18n="smooth"></span><input type="range" id="smooth" min="0.01" max="2" step="0.01" value="0.1" class="accent-orange-500"></label>
                </div>
                <div class="flex items-center gap-2 text-[11px] font-bold text-slate-500">
                    <span data-i18n="groupBy"></span>
                    <button data-group="layer" data-i18n="groupLayer" class="seg"></button>
                    <button data-group="color" data-i18n="groupColor" class="seg"></button>
                </div>
            </section>

            <section class="card space-y-2">
                <div class="flex justify-between items-center">
                    <div data-i18n="secStock" class="label"></div>
                    <a href="stock.html" data-i18n="linkStock" class="text-[11px] font-bold text-blue-600 dark:text-blue-400 hover:underline"></a>
                </div>
                <div id="stock-summary" class="text-[11px] font-mono leading-relaxed whitespace-pre-line"></div>
                <div data-i18n="spindleNote" class="text-[10px] font-bold text-amber-600 dark:text-amber-400"></div>
                <div class="grid grid-cols-3 gap-2" data-advanced>
                    <label class="num-field"><span data-i18n="overcut"></span><span class="num-wrap" data-unit="mm"><input type="number" id="overcut" class="num-in" min="0" step="0.1" value="0.3"></span></label>
                    <label class="num-field"><span data-i18n="safeZ"></span><span class="num-wrap" data-unit="mm"><input type="number" id="safe-z" class="num-in" min="0.5" step="0.5" value="2"></span></label>
                    <label class="num-field"><span data-i18n="resolution"></span><span class="num-wrap" data-unit="mm"><input type="number" id="resolution" class="num-in" min="0.05" step="0.05" value="0.1"></span></label>
                </div>
            </section>

            <section class="card space-y-2">
                <div class="flex justify-between items-center">
                    <div data-i18n="secLayers" class="label"></div>
                    <button id="btn-add-layer" data-i18n="addLayer" class="text-[11px] font-bold text-blue-600 dark:text-blue-400"></button>
                </div>
                <div id="layer-list" class="space-y-1.5"></div>
            </section>

            <section class="card space-y-2">
                <div class="flex justify-between items-center">
                    <div data-i18n="secTools" class="label"></div>
                    <button id="btn-add-tool" data-i18n="addTool" class="text-[11px] font-bold text-blue-600 dark:text-blue-400"></button>
                </div>
                <div id="tool-list" class="space-y-1.5"></div>
                <div id="tool-editor" class="hidden space-y-2 pt-2 border-t border-slate-200 dark:border-slate-800">
                    <div class="grid grid-cols-2 gap-2">
                        <label class="num-field"><span data-i18n="teType"></span><select id="te-type" class="num-in"></select></label>
                        <label class="num-field"><span data-i18n="teD"></span><span class="num-wrap" data-unit="mm"><input type="number" id="te-d" class="num-in" min="0.1" step="0.001"></span></label>
                        <label class="num-field te-flat"><span data-i18n="teFlutes"></span><select id="te-flutes" class="num-in"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
                        <label class="num-field te-flat"><span data-i18n="teCut"></span><select id="te-cut" class="num-in"></select></label>
                        <label class="num-field te-vbit"><span data-i18n="teAngle"></span><span class="num-wrap" data-unit="°"><input type="number" id="te-angle" class="num-in" min="10" max="170" step="1"></span></label>
                        <label class="num-field"><span data-i18n="teF"></span><span class="num-wrap" data-unit="F"><input type="number" id="te-f" class="num-in" min="10" step="10"></span></label>
                        <label class="num-field te-flat"><span data-i18n="teStep"></span><span class="num-wrap" data-unit="mm"><input type="number" id="te-step" class="num-in" min="0.1" step="0.1"></span></label>
                        <label class="num-field te-flat" data-advanced><span data-i18n="teOverlap"></span><input type="number" id="te-overlap" class="num-in" min="0.1" max="0.9" step="0.05"></label>
                    </div>
                    <div id="te-advice" class="text-[11px] leading-relaxed whitespace-pre-line text-slate-600 dark:text-slate-300"></div>
                    <div class="flex gap-2">
                        <button id="te-apply-advice" data-i18n="applyAdvice" class="btn btn-sub flex-1"></button>
                        <button id="te-done" data-i18n="done" class="btn btn-main flex-1"></button>
                    </div>
                </div>
            </section>
        </div>

        <!-- 中：預覽 -->
        <div class="space-y-2 min-w-0">
            <div class="flex flex-wrap items-center gap-2 text-[11px] font-bold">
                <div class="flex bg-slate-200 dark:bg-slate-800 rounded-lg p-0.5">
                    <button id="view-2d" class="seg">2D</button>
                    <button id="view-3d" class="seg">3D</button>
                </div>
                <label class="flex items-center gap-1"><input type="checkbox" id="opt-width" class="accent-orange-500"><span data-i18n="optWidth"></span></label>
                <label class="flex items-center gap-1"><input type="checkbox" id="opt-order" class="accent-orange-500" checked><span data-i18n="optOrder"></span></label>
                <label class="flex items-center gap-1"><input type="checkbox" id="opt-foot" class="accent-orange-500"><span data-i18n="optFoot"></span></label>
                <span class="flex-1"></span>
                <button id="btn-top" data-i18n="btnTop" class="btn btn-sub hidden"></button>
                <button id="btn-fit" data-i18n="btnFit" class="btn btn-sub"></button>
            </div>
            <div id="preview-box" class="relative rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950">
                <svg id="ws" class="w-full h-full block" xmlns="http://www.w3.org/2000/svg"></svg>
                <div id="view3d" class="hidden absolute inset-0"></div>
                <div id="empty" data-i18n="empty" class="absolute inset-x-0 bottom-4 text-center text-sm font-bold text-slate-400 pointer-events-none"></div>
                <div id="ws-warning" class="absolute top-2 inset-x-2 flex flex-col items-center gap-1 pointer-events-none"></div>
            </div>
            <div id="player" class="hidden"></div>
            <div id="hint" data-i18n="hint" class="text-[10px] text-slate-500"></div>
        </div>

        <!-- 右：圖層設定、物件、輸出 -->
        <div class="space-y-4 min-w-0">
            <section id="layer-panel" class="card space-y-2 hidden">
                <div class="flex justify-between items-center">
                    <div data-i18n="secLayer" class="label"></div>
                    <button id="lp-delete" data-i18n="delLayer" class="text-[11px] font-bold text-red-500"></button>
                </div>
                <div class="grid grid-cols-[1fr_44px] gap-2">
                    <input type="text" id="lp-name" class="num-in">
                    <input type="color" id="lp-color" class="w-full h-8 rounded bg-transparent">
                </div>
                <label class="num-field"><span data-i18n="op"></span><select id="lp-op" class="num-in"></select></label>
                <label id="lp-tool-row" class="num-field"><span data-i18n="tool"></span><select id="lp-tool" class="num-in"></select></label>
                <div id="lp-depth-row" class="grid grid-cols-2 gap-2 items-end">
                    <label class="num-field"><span data-i18n="depth"></span><span class="num-wrap" data-unit="mm"><input type="number" id="lp-depth" class="num-in" min="0.1" step="0.1"></span></label>
                    <label class="flex items-center gap-1.5 text-[11px] font-bold pb-2"><input type="checkbox" id="lp-through" class="accent-orange-500"><span data-i18n="through"></span></label>
                </div>
                <label id="lp-tabs-row" class="flex items-center gap-1.5 text-[11px] font-bold"><input type="checkbox" id="lp-tabs" class="accent-orange-500"><span data-i18n="tabs"></span></label>
                <div id="lp-advice" class="text-[11px] leading-relaxed whitespace-pre-line text-slate-600 dark:text-slate-300"></div>
                <div id="lp-warn" class="text-[11px] font-bold text-amber-600 dark:text-amber-400 whitespace-pre-line"></div>
            </section>

            <section class="card space-y-2">
                <div class="flex justify-between items-center">
                    <div data-i18n="secObj" class="label"></div>
                    <button id="op-all" data-i18n="selectAll" class="text-[11px] font-bold text-blue-600 dark:text-blue-400"></button>
                </div>
                <div id="op-none" data-i18n="objHint" class="text-[11px] text-slate-500"></div>
                <div id="op-fields" class="hidden space-y-2">
                    <div id="op-count" class="text-[11px] font-bold"></div>
                    <label class="num-field"><span data-i18n="objLayer"></span><select id="op-layer" class="num-in"></select></label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="num-field"><span>X</span><span class="num-wrap" data-unit="mm"><input type="number" id="op-x" class="num-in" step="0.1"></span></label>
                        <label class="num-field"><span>Y</span><span class="num-wrap" data-unit="mm"><input type="number" id="op-y" class="num-in" step="0.1"></span></label>
                        <label class="num-field"><span data-i18n="width"></span><span class="num-wrap" data-unit="mm"><input type="number" id="op-w" class="num-in" min="0.1" step="0.1"></span></label>
                        <label class="num-field"><span data-i18n="height"></span><span class="num-wrap" data-unit="mm"><input type="number" id="op-h" class="num-in" min="0.1" step="0.1"></span></label>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="op-board" data-i18n="centerBoard" class="btn btn-sub"></button>
                        <button id="op-delete" data-i18n="delObj" class="btn btn-sub text-red-500"></button>
                    </div>
                </div>
            </section>

            <section class="card space-y-2">
                <div class="flex justify-between items-center">
                    <div data-i18n="secFiles" class="label"></div>
                    <span id="total-time" class="text-[11px] font-mono font-bold text-orange-500"></span>
                </div>
                <div id="file-list" class="space-y-2"></div>
                <button id="btn-download-all" data-i18n="downloadAll" class="btn btn-main w-full py-3 text-sm disabled:opacity-40" disabled></button>
            </section>
        </div>
    </main>
</div>

<script src="gordix-table.js?v=8"></script>
<script src="gordix-workspace.js?v=8"></script>
<script src="gordix-import.js?v=8"></script>
<script src="gordix-cam.js?v=8"></script>
<script src="gordix-materials.js?v=8"></script>
<script src="gordix-preview.js?v=8"></script>
<script src="gordix-sim.js?v=8"></script>

let currentLang = localStorage.getItem('gordix-lang') || 'zh';

const $ = id => document.getElementById(id);
const fill = (s, o) => Object.entries(o).reduce((r, [k, v]) => r.split(`{${k}}`).join(v), s);

const rng = (a, b) => a === b ? `${a}` : `${a}～${b}`;

// ===== 毛胚與工作台（步驟 2 設定，這裡唯讀）=====
const stock = GordixTable.loadBoard();
const { id: tableId, table, configured: tableConfigured } = GordixTable.boardTable(stock);
const range = GordixTable.workRange(table);
const boardPoly = stock.on ? GordixTable.boardShape(table, stock) : null;
const boardCenter = GordixTable.boardMid(table, stock);

// ===== 刀具庫（存在瀏覽器，下次沿用）=====
const TOOLS_KEY = 'gordix-tools';
function adviceFor(t) {
    const spec = t.type === 'flat' ? { d: t.d, flutes: t.flutes || 2, type: t.cut || 'downcut' } : { d: t.d, flutes: 2, type: 'straight' };
    return GordixMaterials.cncAdvice(stock.material, spec);
}
// 預設刀具：走速、每層下刀用毛胚材質的建議值（V 刀、球刀一次到深）
function defaultTools() {
    const base = [
        { id: 'flat635', type: 'flat', d: 6.35, flutes: 2, cut: 'downcut', overlap: 0.5 },
        { id: 'flat3175', type: 'flat', d: 3.175, flutes: 1, cut: 'upcut', overlap: 0.5 },
        { id: 'vbit90', type: 'vbit', d: 6.0, angle: 90 },
        { id: 'ball6', type: 'ball', d: 6.0, stepover: 1.8 }
    ];
    return base.map(t => {
        const a = adviceFor(t);
        return Object.assign(t, { f: a ? a.feed : 1000, step: t.type === 'flat' ? (a ? a.doc : 1.0) : 99 });
    });
}
let tools = (() => {
    try { const t = JSON.parse(localStorage.getItem(TOOLS_KEY)); if (Array.isArray(t) && t.length) return t; } catch (e) { }
    return defaultTools();
})();
const saveTools = () => { try { localStorage.setItem(TOOLS_KEY, JSON.stringify(tools)); } catch (e) { } };
const toolById = id => tools.find(t => t.id === id);
function toolName(t) {
    if (!t) return '—';
    const L = T();
    if (t.type === 'vbit') return `${L.vbit} ${t.angle}° Ø${t.d}`;
    if (t.type === 'ball') return `${L.ball} Ø${t.d}`;
    return `${L.flat} Ø${t.d} ${fill(L.flutes, { n: t.flutes || 2 })}${L[t.cut || 'downcut']}`;
}
let editingTool = null;

// ===== 工作（只在記憶體，重新整理清空，與舊版相同）=====
const job = { name: 'job', thickness: stock.t, overcut: 0.3, safeZ: 2, resolution: 0.1, layers: [], objects: [] };
const LAYER_COLORS = ['#f97316', '#3b82f6', '#22c55e', '#eab308', '#a855f7', '#ec4899', '#14b8a6', '#ef4444'];
const OPS = ['profile', 'outer', 'inner', 'pocket', 'laser'];
const OP_KEY = { profile: 'opProfile', outer: 'opOuter', inner: 'opInner', pocket: 'opPocket', laser: 'opLaser' };
let source = null, groupMode = 'layer', layerSeq = 0, files = [];

const selObjs = new Set();

const isRouterOp = op => GordixCam.OPS[op].head === 'router';
const firstFlat = () => (tools.find(t => t.type === 'flat') || tools[0] || {}).id || null;

// 讀檔：向量檔有 mm 單位（或是 DXF）時整體寬帶入實際尺寸
$('btn-file').onclick = () => $('file-input').click();
$('file-input').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const ext = file.name.split('.').pop().toLowerCase();
    const isBitmap = !['svg', 'dxf'].includes(ext);
    const data = await new Promise(res => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        isBitmap ? r.readAsDataURL(file) : r.readAsText(file);
    });
    source = { data, ext, isBitmap };
    const base = file.name.replace(/\.[^.]+$/, '');
    job.name = base.replace(/[^A-Za-z0-9_-]+/g, '_').replace(/^_+|_+$/g, '') || 'job';   // 機器不一定讀得到中文檔名
    $('file-name').innerText = file.name;
    $('threshold-row').classList.toggle('hidden', !isBitmap);
    const real = isBitmap ? null : GordixImport.realWidth(data, ext);
    if (real) $('target-width').value = Math.round(real * 100) / 100;
    job.layers = [];
    if (!isBitmap) groupMode = GordixImport.autoGroupMode(GordixImport.load(data, ext, { targetW: 100, smooth: 0.1 }));
    await importSource(false);
    fitView(true);
    e.target.value = '';
};

// 依目前的寬度、簡化度、門檻與分組重新讀檔；圖層設定依分組鍵沿用，位置保持在原來的中心
async function importSource(keepCenter) {
    if (!source) return;
    const targetW = parseFloat($('target-width').value) || 100;
    const smooth = parseFloat($('smooth').value) || 0.1;
    const paths = source.isBitmap
        ? (await GordixImport.loadBitmap(source.data, { targetW, smooth, threshold: parseInt($('threshold').value, 10) })).paths
        : GordixImport.load(source.data, source.ext, { targetW, smooth });
    const center = keepCenter && job.objects.length ? selectionBox([...job.objects]) : boardCenter;
    const c = { x: (center.minX + center.maxX) / 2 || center.x || 0, y: (center.minY + center.maxY) / 2 || center.y || 0 };
    const old = new Map(job.layers.filter(l => l.key != null).map(l => [l.key, l]));
    const groups = GordixImport.groupPaths(paths.filter(p => p.points.length >= 2), groupMode);
    job.layers = groups.map((g, i) => old.get(g.key) || {
        id: 'L' + (layerSeq++), key: g.key, name: g.key, color: groupMode === 'color' ? g.key : LAYER_COLORS[i % LAYER_COLORS.length],
        visible: true, op: 'profile', toolId: firstFlat(), depth: 3.0, through: false, tabs: false
    });
    job.objects = [];
    groups.forEach((g, i) => g.paths.forEach(p => job.objects.push({
        id: job.objects.length + 1, layerId: job.layers[i].id, points: p.points.map(q => ({ x: q.x + c.x, y: q.y + c.y }))
    })));
    selObjs.clear();
    selLayerId = job.layers.length ? job.layers[0].id : null;
    rebuild();
}
let importTimer = 0;
const reimport = () => { clearTimeout(importTimer); importTimer = setTimeout(() => importSource(true), 250); };
['target-width', 'smooth', 'threshold'].forEach(id => $(id).addEventListener('input', reimport));
document.querySelectorAll('[data-group]').forEach(b => b.onclick = () => {
    if (groupMode === b.dataset.group) return;
    groupMode = b.dataset.group;
    job.layers = [];

});
['overcut', 'safe-z', 'resolution'].forEach(id => $(id).addEventListener('change', rebuild));

// ===== 刀路計算：gordix-cam.js 依圖層與刀具分檔 =====
function rebuild() {
    job.thickness = stock.t;

    job.safeZ = Math.max(0.5, parseFloat($('safe-z').value) || 2);
    job.resolution = Math.max(0.05, parseFloat($('resolution').value) || 0.1);
    files = job.objects.length ? GordixCam.buildFiles(job, tools) : [];
    renderAll();
    schedulePreview();
}

function renderStock() {

function layerWarnings(l) {
    const L = T(), w = [], tool = toolById(l.toolId);
    if (isRouterOp(l.op) && !tool) w.push(L.warnNoTool);
    if (tool && isRouterOp(l.op) && tool.type !== 'flat') w.push(L.warnBit);

    return w;
}

            </div>
            <span class="text-[10px] text-slate-500">${fill(L.objs, { n })}</span>
        </div>`;

}

$('layer-list').addEventListener('click', e => {
    const row = e.target.closest('[data-layer]');

    const l = job.layers.find(x => x.id === row.dataset.layer);

$('btn-add-layer').onclick = () => {
    const l = { id: 'L' + (layerSeq++), key: null, name: `${T().newLayer} ${job.layers.length + 1}`, color: LAYER_COLORS[job.layers.length % LAYER_COLORS.length],

function renderLayerPanel() {
    const l = job.layers.find(x => x.id === selLayerId);
    $('layer-panel').classList.toggle('hidden', !l);
    if (!l) return;
    const L = T();

    set('lp-name', l.name);
    $('lp-color').value = l.color;
    $('lp-op').innerHTML = OPS.map(op => `<option value="${op}">${L[OP_KEY[op]]}</option>`).join('');
    $('lp-op').value = l.op;
    $('lp-tool').innerHTML = tools.map(t => `<option value="${t.id}">${esc(toolName(t))}</option>`).join('');

    $('lp-tabs').checked = l.tabs;
    $('lp-warn').innerText = layerWarnings(l).join('\n');
    // 材質建議：刀具的走速、每層下刀和材質建議比較
    const tool = toolById(l.toolId), lines = [];
    if (l.op === 'laser') {
        const a = GordixMaterials.laserAdvice(stock.material, 'cut', stock.t);
        if (a) lines.push(fill(L.laserAdvice, { p: a.pct, f: a.speed, n: a.passes }));
    } else if (tool) lines.push(...toolAdviceLines(tool));
    $('lp-advice').innerText = lines.join('\n');
}

function toolAdviceLines(t) {
    const L = T(), a = adviceFor(t), mat = GordixMaterials.name(stock.material, currentLang);
    if (!a) return [fill(L.adviceNone, { mat })];
    const out = [fill(L.advice, { mat, fr: rng(a.minF, a.maxF), dr: rng(a.docMin.toFixed(1), a.docMax.toFixed(1)), dial: a.dial })
        + (a.docCap && a.docCap < a.docMax ? fill(L.adviceCap, { cap: a.docCap.toFixed(1) }) : '')];
    if (t.f < a.minF || t.f > a.maxF) out.push(fill(L.warnF, { v: t.f, fr: rng(a.minF, a.maxF) }));
    const max = Math.min(a.docMax, a.docCap || Infinity);
    if (t.type === 'flat' && t.step > max + 1e-9) out.push(fill(L.warnStep, { v: t.step, max: max.toFixed(1) }));
    return out;
}

$('tool-list').addEventListener('click', e => {

        if (editingTool === t.id) editingTool = null;

$('btn-add-tool').onclick = () => {
    const t = { id: 'T' + Date.now().toString(36), type: 'flat', d: 6.35, flutes: 2, cut: 'downcut', overlap: 0.5, angle: 90, f: 1000, step: 1.0 };
    const a = adviceFor(t);

const editTool = (fn) => { const t = toolById(editingTool); if (!t) return; fn(t); if (t.type !== 'flat') t.step = 99; saveTools(); rebuild(); };
$('te-type').onchange = e => editTool(t => { t.type = e.target.value; if (t.type === 'flat' && (!t.step || t.step >= 99)) t.step = 1.0; });

$('te-cut').onchange = e => editTool(t => { t.cut = e.target.value; });
[['te-d', 'd', 0.1], ['te-angle', 'angle', 10], ['te-f', 'f', 10], ['te-step', 'step', 0.05], ['te-overlap', 'overlap', 0.1]].forEach(([id, key, min]) =>

// ===== 物件：選取、移動、縮放、換圖層 =====
function selectionBox(objs) {
    const b = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
    objs.forEach(o => o.points.forEach(p => {
        b.minX = Math.min(b.minX, p.x); b.maxX = Math.max(b.maxX, p.x);
        b.minY = Math.min(b.minY, p.y); b.maxY = Math.max(b.maxY, p.y);
    }));
    return b;
}
const selected = () => job.objects.filter(o => selObjs.has(o.id));
function transformSel(fn) { selected().forEach(o => { o.points = o.points.map(fn); }); }

function renderObjPanel() {
    const sel = selected(), L = T();
    $('op-none').classList.toggle('hidden', sel.length > 0);
    $('op-fields').classList.toggle('hidden', !sel.length);
    if (!sel.length) return;
    const b = selectionBox(sel);
    const set = (id, v) => { if (document.activeElement !== $(id)) $(id).value = v; };
    $('op-count').innerText = fill(L.objCount, { n: sel.length });
    $('op-layer').innerHTML = job.layers.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('');

    $('op-layer').value = layersOfSel.size === 1 ? [...layersOfSel][0] : '';
    set('op-x', ((b.minX + b.maxX) / 2).toFixed(1)); set('op-y', ((b.minY + b.maxY) / 2).toFixed(1));
    set('op-w', (b.maxX - b.minX).toFixed(1)); set('op-h', (b.maxY - b.minY).toFixed(1));
}
$('op-layer').onchange = e => { selected().forEach(o => { o.layerId = e.target.value; }); selLayerId = e.target.value; rebuild(); };
['op-x', 'op-y'].forEach(id => $(id).addEventListener('change', () => {
    const b = selectionBox(selected()), x = parseFloat($('op-x').value), y = parseFloat($('op-y').value);
    if (isNaN(x) || isNaN(y)) return;
    const dx = x - (b.minX + b.maxX) / 2, dy = y - (b.minY + b.maxY) / 2;
    transformSel(p => ({ x: p.x + dx, y: p.y + dy }));
    rebuild();
}));
['op-w', 'op-h'].forEach(id => $(id).addEventListener('change', () => {
    const b = selectionBox(selected()), v = parseFloat($(id).value);
    const k = id === 'op-w' ? v / (b.maxX - b.minX) : v / (b.maxY - b.minY);
    if (!(k > 0) || !isFinite(k)) return;
    const cx = (b.minX + b.maxX) / 2, cy = (b.minY + b.maxY) / 2;
    transformSel(p => ({ x: cx + (p.x - cx) * k, y: cy + (p.y - cy) * k }));
    rebuild();
}));
$('op-board').onclick = () => {
    const b = selectionBox(selected()), dx = boardCenter.x - (b.minX + b.maxX) / 2, dy = boardCenter.y - (b.minY + b.maxY) / 2;
    transformSel(p => ({ x: p.x + dx, y: p.y + dy }));
    rebuild();
};
$('op-delete').onclick = () => { job.objects = job.objects.filter(o => !selObjs.has(o.id)); selObjs.clear(); rebuild(); };
$('op-all').onclick = () => { job.objects.forEach(o => selObjs.add(o.id)); renderAll(); };

// ===== 輸出檔案 =====
function renderFiles() {
    const L = T(), fmt = GordixPreview.fmtTime;
    let routerSeen = 0;
    $('file-list').innerHTML = files.length ? files.map((f, i) => {
        let step;
        if (f.head === 'router') {
            const a = adviceFor(f.tool);
            step = fill(routerSeen++ ? L.stepChange : L.stepFirst, { tool: toolName(f.tool), dial: a ? a.dial : '3' });
        } else {
            const a = GordixMaterials.laserAdvice(stock.material, 'cut', stock.t);
            step = L.stepLaser + (a ? '\n' + fill(L.laserAdvice, { p: a.pct, f: a.speed, n: a.passes }) : '');
        }
        const layers = [...new Set(f.units.map(u => u.layerId))].map(id => (job.layers.find(l => l.id === id) || {}).name).join('、');
        return `<div class="row p-2.5 space-y-1 cursor-default" data-file="${i}">
            <div class="flex justify-between items-center gap-2">
                <div class="text-[12px] font-black truncate">${i + 1}. ${esc(f.name)}</div>
                <button data-dl="${i}" class="btn btn-sub shrink-0">${L.download}</button>
            </div>
            <div class="text-[11px] text-slate-600 dark:text-slate-300 whitespace-pre-line">${esc(step)}</div>
            <div class="text-[10px] text-slate-500">${esc(fill(L.fileInfo, { layers, t: fmt(f.seconds) }))}</div>
        </div>`;
    }).join('') : `<div class="text-[11px] text-slate-500">${L.noFiles}</div>`;
    $('total-time').innerText = files.length ? fill(L.total, { t: fmt(files.reduce((s, f) => s + f.seconds, 0)) }) : '';
    $('btn-download-all').disabled = !files.length;
}

function download(f) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([f.gcode], { type: 'text/plain' }));
    a.download = f.name;
    a.click();
}
$('file-list').addEventListener('click', e => { const i = e.target.dataset.dl; if (i !== undefined) download(files[+i]); });
// 依序下載，每個間隔 300 ms（瀏覽器第一次會詢問是否允許下載多個檔案）
$('btn-download-all').onclick = () => files.forEach((f, i) => setTimeout(() => download(f), i * 300));

// ===== 2D 工作台預覽 =====
const ws = $('ws');
const view = { x: 0, y: 0, w: 1, h: 1 };
const sv = p => `${p.x.toFixed(2)} ${(-p.y).toFixed(2)}`;
const pathD = (pts, close) => 'M' + pts.map(sv).join('L') + (close ? 'Z' : '');
let dragging = false;

// 全景：整個工作台；design = true 時對準加工物件（外加 40% 邊界，至少 300 mm 寬，看得到周圍的板材）
function fitView(design) {
    const r = ws.getBoundingClientRect();
    if (!r.width || !r.height) return;
    let minX, maxX, minY, maxY, pad = 1.1;
    if (design && job.objects.length) {
        const b = selectionBox(job.objects), cx = (b.minX + b.maxX) / 2, half = Math.max(150, (b.maxX - b.minX) * 0.7);
        const cy = -(b.minY + b.maxY) / 2, halfY = Math.max(100, (b.maxY - b.minY) * 0.7);
        [minX, maxX, minY, maxY, pad] = [cx - half, cx + half, cy - halfY, cy + halfY, 1];
    } else {
        const jig = Object.values(GordixTable.corners(table));
        [minX, maxX] = [Math.min(...jig.map(p => p.x)), Math.max(...jig.map(p => p.x))];
        [minY, maxY] = [Math.min(...jig.map(p => -p.y)), Math.max(...jig.map(p => -p.y))];
    }
    const aspect = r.width / r.height;
    view.w = Math.max((maxX - minX) * pad, (maxY - minY) * 1.2 * aspect);
    view.h = view.w / aspect;
    view.x = (minX + maxX) / 2 - view.w / 2;
    view.y = (minY + maxY) / 2 - view.h / 2;
    render2D();
}
function toSvg(cx, cy) {
    const r = ws.getBoundingClientRect();
    return { x: view.x + (cx - r.left) / r.width * view.w, y: view.y + (cy - r.top) / r.height * view.h };
}
function zoomAt(cx, cy, factor) {
    const p = toSvg(cx, cy), w = Math.min(Math.max(view.w / factor, 10), 20000), k = w / view.w;
    view.x = p.x - (p.x - view.x) * k; view.y = p.y - (p.y - view.y) * k;
    view.w = w; view.h *= k;
    render2D();
}

function render2D() {
    if (is3d) return;
    ws.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
    const u = view.w / (ws.clientWidth || 1), L = T(), nss = 'vector-effect="non-scaling-stroke"';
    const isDark = document.documentElement.classList.contains('dark');
    const s = [GordixWorkspace.staticSvg({ table, board: stock, u, isDark, labels: { tableName: L.tableName, front: L.front, legendRange: L.legendRange, legendBoard: L.legendBoard } })];
    const layerOf = id => job.layers.find(l => l.id === id) || {};

    // 刀路（拖曳中先不畫，放開後重算）
    if (!dragging) {
        files.forEach(f => f.units.forEach(un => {
            const l = layerOf(un.layerId), d = f.tool ? f.tool.d : 0.3;
            const dd = un.phases.flatMap(ph => ph.paths.filter(p => p.length > 1).map(p => pathD(p, false))).join('');
            if ($('opt-width').checked) s.push(`<path d="${dd}" fill="none" stroke="${l.color}" stroke-opacity="0.22" stroke-width="${d}" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>`);
            s.push(`<path d="${dd}" fill="none" stroke="${l.color}" stroke-width="1" stroke-dasharray="4 2" ${nss} pointer-events="none"/>`);
        }));
    }
    // 物件：大的先畫，被包住的小圖形在上面才點得到
    const area = o => { const b = selectionBox([o]); return (b.maxX - b.minX) * (b.maxY - b.minY); };
    [...job.objects].sort((a, b) => area(b) - area(a)).forEach(o => {
        const l = layerOf(o.layerId), sel = selObjs.has(o.id), dim = !l.visible || (selLayerId && o.layerId !== selLayerId && !sel);
        s.push(`<path data-obj="${o.id}" d="${pathD(o.points, true)}" fill="${sel ? 'rgba(250,204,21,0.12)' : 'rgba(0,0,0,0.001)'}" stroke="${sel ? '#facc15' : l.color}"
            stroke-width="${sel ? 2.5 : 1.5}" stroke-opacity="${dim ? 0.35 : 1}" ${l.visible ? '' : 'stroke-dasharray="3 3"'} ${nss} style="cursor:move"/>`);
    });
    // 加工順序（跨檔連號）
    if ($('opt-order').checked && !dragging) {
        let n = 1;
        files.forEach(f => f.units.forEach(un => {
            const ph = un.phases.find(p => p.paths.length && p.paths[0].length), p = ph && ph.paths[0][0];
            if (!p) return;
            s.push(`<circle cx="${p.x}" cy="${-p.y}" r="${8 * u}" fill="#ffffff" stroke="#0f172a" stroke-width="1" ${nss} pointer-events="none"/>`);
            s.push(GordixWorkspace.svgText(p.x, -p.y + 3.5 * u, n++, 10 * u, '#0f172a'));
        }));
    }
    // 機器底面 250 × 250（刀頭在選取物件中心時）
    if ($('opt-foot').checked && job.objects.length) {
        const b = selectionBox(selObjs.size ? selected() : job.objects), cx = (b.minX + b.maxX) / 2, cy = (b.minY + b.maxY) / 2;
        s.push(`<rect x="${cx - 125}" y="${-cy - 125}" width="250" height="250" fill="rgba(239,68,68,0.06)" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 4" ${nss} pointer-events="none"/>`);
        s.push(GordixWorkspace.svgText(cx, -cy - 125 - 4 * u, L.foot, 10 * u, '#ef4444'));
    }
    // 動畫進度：已切 / 未切 / 空跑與刀具位置
    const st = player && player.state();
    if (st && merged && st.n < merged.moves.length) {
        const g = GordixPreview.svg2d(merged, st.n);
        s.push(`<path d="${g.todo}" fill="none" stroke="#94a3b8" stroke-width="1.5" ${nss} pointer-events="none"/>`,
            `<path d="${g.travel}" fill="none" stroke="#f97316" stroke-width="1" stroke-dasharray="4 3" ${nss} pointer-events="none"/>`,
            `<path d="${g.done}" fill="none" stroke="#2563eb" stroke-width="2" ${nss} pointer-events="none"/>`);
        const h = headAt(st);
        s.push(`<circle cx="${h.x}" cy="${-h.y}" r="${6 * u}" fill="#dc2626" ${nss} pointer-events="none"/>`);
    }
    ws.innerHTML = s.join('');

    // 位置警告：超出加工範圍（紅）、超出板材（橘）；只提示，不擋下載
    const warns = [];
    if (job.objects.length) {
        const b = selectionBox(job.objects.filter(o => layerOf(o.layerId).visible));
        if (b.minX < -range.x || b.maxX > range.x || b.minY < -range.y || b.maxY > range.y) warns.push(['bg-red-600', L.warnRange]);
        const corners = [{ x: b.minX, y: b.minY }, { x: b.maxX, y: b.minY }, { x: b.maxX, y: b.maxY }, { x: b.minX, y: b.maxY }];
        if (boardPoly && !corners.every(p => GordixTable.insidePolygon(p, boardPoly))) warns.push(['bg-amber-500', L.warnBoard]);
    }
    $('ws-warning').innerHTML = warns.map(([c, m]) => `<span class="${c} text-white text-[11px] font-bold px-3 py-1 rounded-lg shadow">${m}</span>`).join('');
}

// 滑鼠 / 觸控：點圖形選取、拖曳移動；拖空白處平移；滾輪或雙指縮放；雙擊空白處回全景
const drag = { mode: null, last: null, moved: false, pointers: new Map(), pinch: 0 };
ws.addEventListener('pointerdown', e => {
    ws.setPointerCapture(e.pointerId);
    drag.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (drag.pointers.size === 2) {
        const [a, b] = [...drag.pointers.values()];
        drag.mode = 'pinch'; drag.pinch = Math.hypot(a.x - b.x, a.y - b.y);
        return;
    }
    const el = e.target.closest('[data-obj]');
    drag.moved = false;
    drag.last = toSvg(e.clientX, e.clientY);
    if (el) {
        const id = +el.dataset.obj;
        if (e.shiftKey) { selObjs.has(id) ? selObjs.delete(id) : selObjs.add(id); }
        else if (!selObjs.has(id)) { selObjs.clear(); selObjs.add(id); }
        selLayerId = job.objects.find(o => o.id === id).layerId;
        drag.mode = 'move';
        renderAll();
    } else {
        drag.mode = 'pan';
        drag.client = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
    }
});
ws.addEventListener('pointermove', e => {
    if (!drag.pointers.has(e.pointerId)) return;
    drag.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (drag.mode === 'pinch' && drag.pointers.size === 2) {
        const [a, b] = [...drag.pointers.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
        if (drag.pinch) zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, d / drag.pinch);
        drag.pinch = d;
        return;
    }
    if (drag.mode === 'move') {
        const p = toSvg(e.clientX, e.clientY), dx = p.x - drag.last.x, dy = -(p.y - drag.last.y);
        if (!dx && !dy) return;
        drag.last = p; drag.moved = true; dragging = true;
        transformSel(q => ({ x: q.x + dx, y: q.y + dy }));
        render2D();
    } else if (drag.mode === 'pan') {
        const r = ws.getBoundingClientRect();
        view.x = drag.client.vx - (e.clientX - drag.client.x) / r.width * view.w;
        view.y = drag.client.vy - (e.clientY - drag.client.y) / r.height * view.h;
        drag.moved = true;
        render2D();
    }
});
const endDrag = e => {
    drag.pointers.delete(e.pointerId);
    if (drag.mode === 'pan' && !drag.moved && !e.shiftKey && selObjs.size) { selObjs.clear(); renderAll(); }
    if (drag.mode === 'move' && drag.moved) { dragging = false; rebuild(); }
    dragging = false;
    if (!drag.pointers.size) drag.mode = null;
};
ws.addEventListener('pointerup', endDrag);
ws.addEventListener('pointercancel', endDrag);
ws.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.pow(1.1, -e.deltaY / 100)); }, { passive: false });
ws.addEventListener('dblclick', e => { if (!e.target.closest('[data-obj]')) fitView(); });
['opt-width', 'opt-order', 'opt-foot'].forEach(id => $(id).onchange = render2D);
$('btn-fit').onclick = () => { is3d ? view3d.setTop(false) : fitView(); };

// ===== 預覽：所有檔接在一起播放（每段帶自己的刀具），3D 加切削模擬 =====
let is3d = false, view3d = null, merged = null, player = null, bar = null, sim = null, simObj = null;
let previewTimer = 0, want = null, busy = false, drawnAt = 0;
const simTool = t => ({ type: t.type, d: t.d, angle: t.angle });

function mergeFiles() {
    const lines = [], moves = [];
    files.forEach(f => {
        const p = GordixPreview.parse(f.gcode), off = lines.length, tool = f.head === 'router' ? simTool(f.tool) : null;
        p.moves.forEach(m => moves.push(Object.assign({}, m, { line: m.line + off, tool })));
        lines.push(...p.lines);
    });
    return { lines, moves, starts: GordixPreview.strokeStarts(moves), hasZ: true };
}

function schedulePreview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(rebuildPreview, 300);
}

function rebuildPreview() {
    merged = files.length ? mergeFiles() : null;
    $('player').classList.toggle('hidden', !merged);
    player = null; sim = null;
    if (simObj) { if (view3d) view3d.setSim(null); simObj.dispose(); simObj = null; }
    if (!merged) { render2D(); return; }
    player = GordixPreview.Player(merged).on(s => { want = s; pump(); });
    bar = GordixPreview.PlayerBar($('player'), player, currentLang);
    if (is3d) build3d();
    want = player.state();
    pump();
}

function outlines() {
    const out = [[{ x: -range.x, y: -range.y }, { x: range.x, y: -range.y }, { x: range.x, y: range.y }, { x: -range.x, y: range.y }]];
    if (boardPoly) out.push(boardPoly);
    return out;
}

function build3d() {
    if (!view3d) { view3d = GordixPreview.View3D($('view3d')); view3d.resize(); }
    if (!merged) return;
    view3d.setMoves(merged, outlines());
    if (merged.moves.some(m => m.tool)) {
        sim = GordixSim.create(merged.moves, merged.moves.find(m => m.tool).tool, stock.t);
        simObj = GordixSim.Mesh(sim, THREE);
        view3d.setSim(simObj);
    }
}

function headAt(st) {
    const mv = merged.moves, a = mv[st.n - 1] || { x: 0, y: 0, z: job.safeZ }, b = mv[st.n];
    return b ? { x: a.x + (b.x - a.x) * st.frac, y: a.y + (b.y - a.y) * st.frac, z: a.z + (b.z - a.z) * st.frac } : a;
}

// 依播放位置更新：3D 算模擬（每個畫面最多 12 ms，沒算完下個畫面繼續），2D 畫進度；每 0.08 秒最多重畫一次
function pump() {
    if (!want || !merged) return;
    const now = performance.now();
    let finished = true;
    if (is3d && sim) finished = GordixSim.advance(sim, want.n, want.frac, now + 12);
    if (finished || now - drawnAt > 80) {
        drawnAt = now;
        if (is3d && view3d) view3d.setProgress(want.n, want.frac);
        else render2D();
    }
    if (!finished && !busy) { busy = true; requestAnimationFrame(() => { busy = false; pump(); }); }
}

function setView(on3d) {
    if (on3d && typeof THREE === 'undefined') return;
    is3d = on3d;
    ws.classList.toggle('hidden', on3d);
    $('view3d').classList.toggle('hidden', !on3d);
    $('btn-top').classList.toggle('hidden', !on3d);
    ['opt-width', 'opt-order', 'opt-foot'].forEach(id => $(id).parentElement.classList.toggle('hidden', on3d));
    $('view-2d').classList.toggle('on', !on3d);
    $('view-3d').classList.toggle('on', on3d);
    if (on3d) {
        if (!view3d) build3d();
        else if (merged && !sim && merged.moves.some(m => m.tool)) build3d();
        view3d.resize();
        if (want) { drawnAt = 0; pump(); }
    } else render2D();
}
$('view-2d').onclick = () => setView(false);
$('view-3d').onclick = () => setView(true);
$('btn-top').onclick = () => view3d && view3d.setTop(true);

// ===== 語言、主題、進階 =====
function applyLang() {
    const L = T();
    document.querySelectorAll('[data-i18n]').forEach(el => { el.innerText = L[el.dataset.i18n]; });
    $('lang-toggle').innerText = L.lang;
    if (!source) $('file-name').innerText = L.noFile;
    renderAdvanced();
    renderAll();
    if (bar) bar.setLang(currentLang);
}
$('lang-toggle').onclick = () => {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    localStorage.setItem('gordix-lang', currentLang);
    applyLang();
};
function setTheme(theme) {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    $('theme-icon').innerHTML = theme === 'dark'
        ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z" />'
        : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />';
    localStorage.setItem('gordix-theme', theme);
    render2D();
}
$('theme-toggle').onclick = () => setTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
const ADVANCED_KEY = 'gordix-advanced';
function renderAdvanced() {
    const on = document.body.classList.contains('show-advanced');
    $('advanced-toggle').innerText = on ? T().advOn : T().advOff;
    $('advanced-toggle').className = 'px-3 py-1.5 rounded-lg text-[11px] font-bold border border-white/20 ' + (on ? 'bg-white text-orange-600' : 'bg-white/10 hover:bg-white/20');
}
$('advanced-toggle').onclick = () => {
    const on = !document.body.classList.contains('show-advanced');
    document.body.classList.toggle('show-advanced', on);
    try { localStorage.setItem(ADVANCED_KEY, on ? '1' : '0'); } catch (e) { }
    renderAdvanced();
};
try { document.body.classList.toggle('show-advanced', localStorage.getItem(ADVANCED_KEY) === '1'); } catch (e) { }

new ResizeObserver(() => { if (is3d && view3d) view3d.resize(); else if (view.w <= 1) fitView(); else render2D(); }).observe($('preview-box'));
setTheme(localStorage.getItem('gordix-theme') || 'dark');
setView(false);
applyLang();
fitView();

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => { }));
}
</script>
