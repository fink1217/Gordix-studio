<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC Converter</title>
    <script src="vendor/tailwindcss.js?v=3.4.17"></script>
    <!-- 數字欄位可以輸入算式（+ - * /） -->
    <script src="gordix-calc.js?v=10"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script src="vendor/three-0.128.0.min.js"></script>
    <script src="vendor/OrbitControls-0.128.0.js"></script>
    <script src="vendor/clipper-6.4.2.js"></script>
    <script src="vendor/dxf-parser-1.1.2.min.js"></script>
    <style>
        html { overflow-y: scroll; }
        body:not(.show-advanced) [data-advanced] { display: none !important; }
        .card { border-radius: 0.75rem; border: 1px solid #e2e8f0; background: #f8fafc; padding: 1rem; }
        .dark .card { border-color: #1e293b; background: rgba(2, 6, 23, 0.5); }
        .label { font-size: 10px; font-weight: 900; letter-spacing: 0.08em; color: #64748b; }
        .dark .label { color: #94a3b8; }
        .num-field { display: flex; flex-direction: column; gap: 2px; font-size: 10px; font-weight: 700; color: #64748b; }
        .num-wrap { position: relative; display: block; }
        .num-wrap::after { content: attr(data-unit); position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 10px; color: #94a3b8; pointer-events: none; }
        .num-in { width: 100%; padding: 6px 30px 6px 8px; border-radius: 6px; outline: none; font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: #fff; border: 1px solid #cbd5e1; color: #1e293b; }
        select.num-in, input[type=text].num-in { padding-right: 8px; }
        .dark .num-in { background: #1e293b; border-color: #334155; color: #fff; }
        .num-in:disabled { opacity: 0.4; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        .seg { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; color: #64748b; }
        .seg.on { background: #f97316; color: #fff; }
        .row { border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; }
        .dark .row { border-color: #1e293b; }
        .row.active { border-color: #f97316; background: rgba(249, 115, 22, 0.08); }
        .btn { padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; }
        .btn-main { background: #f97316; color: #fff; }
        .btn-main:hover { background: #fb923c; }
        .btn-sub { background: rgba(148, 163, 184, 0.18); color: #334155; }
        .dark .btn-sub { color: #e2e8f0; }
        .btn-sub:hover { background: rgba(148, 163, 184, 0.3); }
        #preview-box { height: min(64vh, 680px); min-height: 360px; touch-action: none; }
        #ws text { font-family: ui-monospace, Consolas, monospace; user-select: none; }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="gordix-ui.css?v=18">
    <script src="gordix-ui.js?v=18" defer></script>
</head>
<body data-preview-layout="fixed" data-studio-page="CNC" class="bg-slate-50 dark:bg-slate-950 min-h-screen p-3 md:p-6 text-slate-800 dark:text-slate-200 font-sans">
<div class="studio-shell max-w-[1600px] mx-auto bg-white dark:bg-slate-900 rounded-2xl shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-800">
    <!-- 頁首 -->
    <div class="studio-header bg-gradient-to-r from-orange-500 to-red-600 p-4 md:p-5 text-white flex justify-between items-center gap-3">
        <div>
            <div data-i18n="stepLabel" class="text-[11px] font-bold text-white/75"></div>
            <h1 data-i18n="title" class="text-lg md:text-2xl font-black"></h1>
        </div>
        <div class="flex gap-2 items-center shrink-0">
            <a href="index.html" class="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 border border-white/20" title="首頁 / Home">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="20" y1="12" x2="4" y2="12"/><polyline points="10 18 4 12 10 6"/></svg>
            </a>
            <button id="theme-toggle" class="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 border border-white/20" aria-label="Toggle Theme">
                <svg id="theme-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"></svg>
            </button>
            <button id="lang-toggle" class="px-3 py-1.5 rounded-lg text-[11px] font-bold bg-white/10 hover:bg-white/20 border border-white/20 whitespace-nowrap"></button>
            <button id="advanced-toggle" class="px-3 py-1.5 rounded-lg text-[11px] font-bold border border-white/20"></button>
            <a href="params.html" class="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 border border-white/20" title="參數指南 / Parameter guide">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            </a>
        </div>
    </div>
        <nav class="studio-workflow" aria-label="加工流程 / Workflow">
            <a href="table_conf.html"><b>01</b><span class="studio-zh">工作台</span><span class="studio-en">Table</span></a>
            <a href="stock.html"><b>02</b><span class="studio-zh">毛胚</span><span class="studio-en">Stock</span></a>
            <a href="index.html#step-3" aria-current="step"><b>03</b><span class="studio-zh">加工設定</span><span class="studio-en">Toolpaths</span></a>
            <a href="Gcodetrans.html"><b>04</b><span class="studio-zh">檢查輸出</span><span class="studio-en">Review</span></a>
        </nav>

    <main class="studio-workbench grid grid-cols-1 xl:grid-cols-[300px_1fr_330px] gap-4 p-3 md:p-4">
        <!-- 左：檔案、毛胚、圖層、刀具庫 -->
        <div class="studio-sidebar space-y-4 min-w-0">
            <section class="studio-panel card space-y-2">
                <div data-i18n="secFile" class="label"></div>
                <input type="file" id="file-input" multiple accept=".svg,.dxf,.png,.jpg,.jpeg,.bmp,.webp" class="hidden">
                <button data-ui-action="import" id="btn-file" data-i18n="btnFile" class="btn btn-main w-full"></button>
                <label class="num-field"><span data-i18n="sourceLabel">目前編輯的來源圖</span><select id="source-select" class="num-in" disabled></select></label>
                <p id="import-error" role="alert" class="text-xs text-red-500 whitespace-pre-line"></p>
                <div id="file-name" class="text-[11px] text-slate-500 truncate"></div>
                <div class="grid grid-cols-2 gap-2">
                    <label class="num-field col-span-2"><span data-i18n="targetW"></span><span class="num-wrap" data-unit="mm"><input type="number" id="target-width" class="num-in" min="1" step="0.1" value="100"></span></label>
                    <label id="threshold-row" class="num-field col-span-2 hidden"><span data-i18n="threshold"></span><input type="range" id="threshold" min="1" max="254" value="128" class="accent-orange-500"></label>
                    <label class="num-field col-span-2" data-advanced><span data-i18n="smooth"></span><input type="range" id="smooth" min="0.01" max="2" step="0.01" value="0.1" class="accent-orange-500"></label>
                </div>
                <div class="flex items-center gap-2 text-[11px] font-bold text-slate-500">
                    <span data-i18n="groupBy"></span>
                    <button data-group="layer" data-i18n="groupLayer" class="seg"></button>
                    <button data-group="color" data-i18n="groupColor" class="seg"></button>
                </div>
            </section>

            <section class="studio-panel card space-y-2">
                <div class="flex justify-between items-center">
                    <div data-i18n="secStock" class="label"></div>
                    <a href="stock.html" data-i18n="linkStock" class="text-[11px] font-bold text-blue-600 dark:text-blue-400 hover:underline"></a>
                </div>
                <div id="stock-summary" class="text-[11px] font-mono leading-relaxed whitespace-pre-line"></div>
                <div data-i18n="spindleNote" class="text-[10px] font-bold text-amber-600 dark:text-amber-400"></div>
                <div class="grid grid-cols-3 gap-2" data-advanced>
                    <label class="num-field"><span data-i18n="overcut"></span><span class="num-wrap" data-unit="mm"><input type="number" id="overcut" class="num-in" min="0" step="0.1" value="0.3"></span></label>
                    <label class="num-field"><span data-i18n="safeZ"></span><span class="num-wrap" data-unit="mm"><input type="number" id="safe-z" class="num-in" min="0.5" step="0.5" value="2"></span></label>
                    <label class="num-field"><span data-i18n="resolution"></span><span class="num-wrap" data-unit="mm"><input type="number" id="resolution" class="num-in" min="0.05" step="0.05" value="0.1"></span></label>
                </div>
            </section>

            <section class="studio-panel card space-y-2">
                <div class="flex justify-between items-center">
                    <div data-i18n="secLayers" class="label"></div>
                    <button id="btn-add-layer" data-i18n="addLayer" class="text-[11px] font-bold text-blue-600 dark:text-blue-400"></button>
                </div>
                <div class="flex items-center gap-2 text-[11px]"><button id="btn-expand-layers" class="btn btn-sub" data-i18n="expandAll">全部展開</button><button id="btn-collapse-layers" class="btn btn-sub" data-i18n="collapseAll">全部收合</button></div>
                <p class="text-[11px] text-slate-500 dark:text-slate-400" data-i18n="layerLogic">眼睛：只隱藏編輯預覽；輸出勾選：決定加工內容。拖曳物件到圖層即可搬移。</p>
                <div id="layer-list" class="space-y-1.5"></div>
            </section>

            <section class="studio-panel card space-y-2">
                <div class="flex justify-between items-center">
                    <div data-i18n="secTools" class="label"></div>
                    <button id="btn-add-tool" data-i18n="addTool" class="text-[11px] font-bold text-blue-600 dark:text-blue-400"></button>
                </div>
                <div id="tool-list" class="space-y-1.5"></div>
                <div id="tool-editor" class="hidden space-y-2 pt-2 border-t border-slate-200 dark:border-slate-800">
                    <div class="grid grid-cols-2 gap-2">
                        <label class="num-field col-span-2"><span data-i18n="teName"></span><input type="text" id="te-name" class="num-in" maxlength="80"></label>
                        <label class="num-field"><span data-i18n="teType"></span><select id="te-type" class="num-in"></select></label>
                        <label class="num-field"><span data-i18n="teD"></span><span class="num-wrap" data-unit="mm"><input type="number" id="te-d" class="num-in" min="0.1" step="0.001"></span></label>
                        <label class="num-field te-flat"><span data-i18n="teFlutes"></span><input type="number" id="te-flutes" class="num-in" min="1" step="1"></label>
                        <label class="num-field te-flat"><span data-i18n="teCut"></span><select id="te-cut" class="num-in"></select></label>
                        <label class="num-field te-vbit"><span data-i18n="teAngle"></span><span class="num-wrap" data-unit="°"><input type="number" id="te-angle" class="num-in" min="10" max="170" step="1"></span></label>
                        <label class="num-field"><span data-i18n="teF"></span><span class="num-wrap" data-unit="F"><input type="number" id="te-f" class="num-in" min="10" step="10"></span></label>
                        <label class="num-field te-flat"><span data-i18n="teStep"></span><span class="num-wrap" data-unit="mm"><input type="number" id="te-step" class="num-in" min="0.1" step="0.1"></span></label>
                        <label class="num-field te-flat" data-advanced><span data-i18n="teOverlap"></span><input type="number" id="te-overlap" class="num-in" min="0.1" max="0.9" step="0.05"></label>
                    </div>
                    <div id="te-advice" class="text-[11px] leading-relaxed whitespace-pre-line text-slate-600 dark:text-slate-300"></div>
                    <div class="flex gap-2">
                        <button id="te-apply-advice" data-i18n="applyAdvice" class="btn btn-sub flex-1"></button>
                        <button id="te-done" data-i18n="done" class="btn btn-main flex-1"></button>
                    </div>
                </div>
            </section>
        </div>

        <!-- 中：預覽 -->
        <div class="studio-center space-y-2 min-w-0">
            <div class="flex flex-wrap items-center gap-2 text-[11px] font-bold">
                <div class="flex bg-slate-200 dark:bg-slate-800 rounded-lg p-0.5">
                    <button id="view-2d" class="seg">2D</button>
                    <button id="view-3d" class="seg">3D</button>
                </div>
                <label class="flex items-center gap-1"><input type="checkbox" id="opt-width" class="accent-orange-500"><span data-i18n="optWidth"></span></label>
                <label class="flex items-center gap-1"><input type="checkbox" id="opt-order" class="accent-orange-500" checked><span data-i18n="optOrder"></span></label>
                <label class="flex items-center gap-1"><input type="checkbox" id="opt-foot" class="accent-orange-500"><span data-i18n="optFoot"></span></label>
                <label class="flex items-center gap-1"><input type="checkbox" id="opt-zone" class="accent-orange-500" checked><span data-i18n="optZone"></span></label>
                <span class="flex-1"></span>
                <button id="btn-undo" class="btn btn-sub disabled:opacity-40" title="Ctrl+Z" disabled>↶</button>
                <button id="btn-redo" class="btn btn-sub disabled:opacity-40" title="Ctrl+Y" disabled>↷</button>
                <button id="btn-top" data-i18n="btnTop" class="btn btn-sub hidden"></button>
                <label class="flex items-center gap-1"><input type="checkbox" id="opt-stock-model" class="accent-orange-500" checked><span data-i18n="stockModel">毛胚模型</span></label>
                <label class="flex items-center gap-1"><input type="checkbox" id="opt-tabs" class="accent-amber-500" checked><span data-i18n="tabPreview">橋位標記</span></label>
                <button id="btn-fit" data-i18n="btnFit" class="btn btn-sub"></button>
            </div>
            <div id="preview-box" class="relative rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950">
                <svg id="ws" class="w-full h-full block" xmlns="http://www.w3.org/2000/svg"></svg>
                <div id="view3d" class="hidden absolute inset-0"></div>
                <div id="empty" data-i18n="empty" class="absolute inset-x-0 bottom-4 text-center text-sm font-bold text-slate-400 pointer-events-none"></div>
                <div id="ws-warning" class="absolute top-2 inset-x-2 flex flex-col items-center gap-1 pointer-events-none"></div>
            </div>
            <div id="player" class="hidden"></div>
            <div id="hint" data-i18n="hint" class="text-[10px] text-slate-500"></div>
        </div>

        <!-- 右：圖層設定、物件、輸出 -->
        <div class="studio-sidebar space-y-4 min-w-0">
            <section id="layer-panel" class="studio-panel card space-y-2 hidden">
                <div class="flex justify-between items-center">
                    <div data-i18n="secLayer" class="label"></div>
                    <button id="lp-delete" data-i18n="delLayer" class="text-[11px] font-bold text-red-500"></button>
                </div>
                <div class="grid grid-cols-[1fr_44px] gap-2">
                    <input type="text" id="lp-name" class="num-in">
                    <input type="color" id="lp-color" class="w-full h-8 rounded bg-transparent">
                </div>
                <label class="num-field"><span data-i18n="op"></span><select id="lp-op" class="num-in"></select></label>
                <label id="lp-tool-row" class="num-field"><span data-i18n="tool"></span><select id="lp-tool" class="num-in"></select></label>
                <div id="lp-depth-row" class="grid grid-cols-2 gap-2 items-end">
                    <label class="num-field"><span data-i18n="depth"></span><span class="num-wrap" data-unit="mm"><input type="number" id="lp-depth" class="num-in" min="0.1" step="0.1"></span></label>
                    <label class="flex items-center gap-1.5 text-[11px] font-bold pb-2"><input type="checkbox" id="lp-through" class="accent-orange-500"><span data-i18n="through"></span></label>
                </div>
                <label id="lp-side-row" class="num-field"><span data-i18n="carveSide"></span><select id="lp-side" class="num-in"></select></label>
                <div id="lp-tab-settings" class="hidden space-y-1"><label class="num-field"><span data-i18n="tabHeight">橋位保留厚度</span><span class="num-wrap" data-unit="mm"><input id="lp-tab-height" type="number" class="num-in" min="0.01" step="0.1"></span></label><div id="lp-tab-summary" class="text-xs font-mono text-amber-600 dark:text-amber-400"></div></div>
                <label id="lp-tabs-row" class="flex items-center gap-1.5 text-[11px] font-bold"><input type="checkbox" id="lp-tabs" class="accent-orange-500"><span data-i18n="tabs"></span></label>
                <div id="lp-laser-row" class="hidden space-y-2">
                    <div class="grid grid-cols-2 gap-2">
                        <label class="num-field"><span data-i18n="laserPower"></span><span class="num-wrap" data-unit="%"><input type="number" id="lp-laser-pct" class="num-in" min="0" max="100" step="0.1"></span></label>
                        <label class="num-field"><span data-i18n="laserFeed"></span><span class="num-wrap" data-unit="F"><input type="number" id="lp-laser-feed" class="num-in" min="1" step="10"></span></label>
                        <label class="num-field"><span data-i18n="laserPasses"></span><input type="number" id="lp-laser-passes" class="num-in" min="1" max="100" step="1"></label>
                    </div>
                    <div id="lp-laser-actual" class="text-xs font-mono text-slate-600 dark:text-slate-300"></div>
                    <button id="lp-laser-advice" data-i18n="applyAdvice" class="btn btn-sub w-full"></button>
                </div>
                <div id="lp-advice" class="text-[11px] leading-relaxed whitespace-pre-line text-slate-600 dark:text-slate-300"></div>
                <div id="lp-warn" class="text-[11px] font-bold text-amber-600 dark:text-amber-400 whitespace-pre-line"></div>
            </section>

            <section class="studio-panel card space-y-2">
                <div class="flex justify-between items-center">
                    <div data-i18n="secObj" class="label"></div>
                    <button id="op-all" data-i18n="selectAll" class="text-[11px] font-bold text-blue-600 dark:text-blue-400"></button>
                </div>
                <div id="op-none" data-i18n="objHint" class="text-[11px] text-slate-500"></div>
                <div id="op-fields" class="hidden space-y-2">
                    <div id="op-count" class="text-[11px] font-bold"></div>
                    <label class="num-field"><span data-i18n="objLayer"></span><select id="op-layer" class="num-in"></select></label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="num-field"><span>X</span><span class="num-wrap" data-unit="mm"><input type="number" id="op-x" class="num-in" step="0.1"></span></label>
                        <label class="num-field"><span>Y</span><span class="num-wrap" data-unit="mm"><input type="number" id="op-y" class="num-in" step="0.1"></span></label>
                        <label class="num-field"><span data-i18n="width"></span><span class="num-wrap" data-unit="mm"><input type="number" id="op-w" class="num-in" min="0.1" step="0.1"></span></label>
                        <label class="num-field"><span data-i18n="height"></span><span class="num-wrap" data-unit="mm"><input type="number" id="op-h" class="num-in" min="0.1" step="0.1"></span></label>
                        <label class="num-field col-span-2"><span data-i18n="rotationLabel">旋轉角度（逆時針）</span><span class="num-wrap" data-unit="°"><input type="number" id="op-angle" class="num-in" step="1" value="0"></span></label>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="op-group" data-i18n="group" class="btn btn-sub"></button>
                        <button id="op-ungroup" data-i18n="ungroup" class="btn btn-sub"></button>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="op-board" data-i18n="centerBoard" class="btn btn-sub"></button>
                        <button id="op-delete" data-i18n="delObj" class="btn btn-sub text-red-500"></button>
                    </div>
                </div>
            </section>

            <section class="studio-panel card space-y-2">
                <div class="flex justify-between items-center">
                    <div data-i18n="secFiles" class="label"></div>
                    <span id="total-time" class="text-[11px] font-mono font-bold text-orange-500"></span>
                </div>
                <div class="space-y-1">
                    <label class="flex items-center gap-2 text-xs font-bold"><input type="checkbox" id="rapid-enable" class="accent-orange-500" checked><span data-i18n="rapidEnable">空切加速</span></label>
                    <label class="num-field"><span data-i18n="rapidFeed">空切走速（獨立F）</span><span class="num-wrap" data-unit="mm/min"><input type="number" id="rapid-feed" class="num-in" min="1" max="2000" step="100" value="2000"></span></label>
                    <p class="text-[11px] text-slate-500 dark:text-slate-400" data-i18n="rapidTip">G0 空切帶獨立 F，切削恢復刀具走速；實際速度仍受韌體上限與 G0 支援方式限制。</p>
                </div>
                <label class="num-field"><span data-i18n="routeMode">刀路編排</span>
                    <select id="route-mode" class="num-in"><option value="short">雷射畫線減少空跑</option><option value="center">畫線也由中心往外</option></select>
                </label>
                <p class="text-[11px] text-slate-500 dark:text-slate-400">銑削與切割仍由中心往外，只有雷射畫線自由排序。</p>
                <div id="route-stats" class="text-xs font-mono text-slate-600 dark:text-slate-300"></div>
                <!-- 放樣檔：加工前用畫筆或雷射標出外框、孔位十字、零件編號 -->
                <div class="row p-2.5 space-y-1.5 cursor-default">
                    <label class="flex items-center gap-2 text-[12px] font-black"><input type="checkbox" id="lo-on" class="accent-orange-500"><span data-i18n="layoutTitle"></span></label>
                    <div id="lo-opts" class="space-y-1.5 text-[11px]">
                        <div class="flex flex-wrap gap-x-3 gap-y-1">
                            <label class="flex items-center gap-1"><input type="checkbox" id="lo-outline" class="accent-orange-500" checked><span data-i18n="loOutline"></span></label>

// 自動群組：最外層的圖形連同它包住的所有圖形（不分圖層）是一個零件；沒有包住別人的單獨圖形不分組
function autoGroup(objects=job.objects) {
    const shapes = objects.map(o => ({ o, points: o.points, bounds: GordixCam.boundsOf(o.points) }));
    const area = sh => (sh.bounds.maxX - sh.bounds.minX) * (sh.bounds.maxY - sh.bounds.minY);
    const members = new Map();
    shapes.forEach(sh => {
        const outer = shapes.filter(t => t !== sh && area(t) > area(sh) && GordixCam.isInsideOther(sh, t));
        const top = outer.length ? outer.reduce((a, b) => area(a) > area(b) ? a : b) : sh;
        if (!members.has(top)) members.set(top, []);
        members.get(top).push(sh.o);
    });
    objects.forEach(o => { o.groupId = null; });
    members.forEach(list => { if (list.length > 1) { const g = 'G' + (++groupSeq); list.forEach(o => { o.groupId = g; }); } });
}

    if (!job.layers.some(l => l.id === selLayerId)) selLayerId = job.layers.length ? job.layers[0].id : null;
    rebuild(false);
    renderUndo();
}
const undo = () => { if (importBusy) return; clearTimeout(importTimer); importVersion++; if (history.index > 0) restore(history.index - 1); };
const redo = () => { if (importBusy) return; clearTimeout(importTimer); importVersion++; if (history.index < history.stack.length - 1) restore(history.index + 1); };
function renderUndo() {
    $('btn-undo').disabled = history.index <= 0;
    $('btn-redo').disabled = history.index >= history.stack.length - 1;
}

const isRouterOp = op => GordixCam.OPS[op].head === 'router';
const isLaserOp = op => GordixCam.OPS[op].head === 'laser';
const firstFlat = () => (tools.find(t => t.type === 'flat') || tools[0] || {}).id || null;

// 讀檔：向量檔有 mm 單位（或是 DXF）時整體寬帶入實際尺寸
$('btn-file').onclick = () => $('file-input').click();
/** 將來源設定帶回檔案面板；更換來源不會刪除其他圖案。 */
function syncSource() {
    $('source-select').innerHTML='';
    sources.forEach(src => {
        const option=document.createElement('option');option.value=src.id;option.textContent=src.name;
        $('source-select').append(option);
    });
    $('source-select').disabled=!sources.size || importBusy;
    if (!source) {$('file-name').innerText='';return;}
    $('source-select').value=source.id;
    $('file-name').innerText=source.name;
    $('target-width').value=source.targetW;
    $('smooth').value=source.smooth;
    $('threshold').value=source.threshold;
    $('threshold-row').classList.toggle('hidden',!source.isBitmap);

}
$('source-select').onchange=e => {
    clearTimeout(importTimer); importVersion++;
    source=sources.get(+e.target.value);syncSource();renderStock();
};
$('file-input').onchange=async e => {
    const batch=[...e.target.files];e.target.value='';
    if (importBusy || !batch.length) return;
    clearTimeout(importTimer);importVersion++;commit();
    importBusy=true;document.body.inert=true;
    const failures=[];
    for (const file of batch) {
        try {
            const ext=file.name.split('.').pop().toLowerCase(), isBitmap=!['svg','dxf'].includes(ext);
            const data=isBitmap ? await new Promise((resolve,reject) => {
                const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('無法讀檔'));reader.readAsDataURL(file);
            }) : await file.text();
            const paths=isBitmap ? null : GordixImport.load(data,ext,{targetW:100,smooth:.1});
            if (paths && !paths.length) throw new Error('找不到可加工路徑');
            const candidate={id:++sourceSeq,name:file.name,data,ext,isBitmap,
                targetW:isBitmap ? 100 : GordixImport.realWidth(data,ext) || 100,
                smooth:+$('smooth').value || .1,threshold:+$('threshold').value || 128,
                groupMode:isBitmap ? 'layer' : GordixImport.autoGroupMode(paths)};
            const decoded=await sourcePaths(candidate);
            if (!decoded.length) throw new Error('找不到可加工路徑');
            const existing=job.objects.length ? selectionBox(job.objects) : null;
            const bounds=GordixCam.boundsOf(decoded.flatMap(p=>p.points));
            const center=existing ? {x:existing.maxX+10+(bounds.maxX-bounds.minX)/2,y:boardCenter.y} : boardCenter;
            source=candidate;sources.set(source.id,source);sourceData.set(source.id,data);
            appendPaths(decoded,center,false);
            const base=file.name.replace(/\.[^.]+$/,'');
            job.name=sources.size>1 ? 'composition' : base.replace(/[^A-Za-z0-9_-]+/g,'_').replace(/^_+|_+$/g,'') || 'job';
        } catch(error) {failures.push(file.name+'：'+error.message);}
    }
    importBusy=false;document.body.inert=false;
    syncSource();$('import-error').innerText=failures.join('\n');
    rebuild();fitView(true);
};

/** 解析指定來源，所有 await 在修改既有工作之前完成。 */
async function sourcePaths(src) {
    return src.isBitmap ? (await GordixImport.loadBitmap(src.data,{targetW:src.targetW,smooth:src.smooth,threshold:src.threshold})).paths
        : GordixImport.load(src.data,src.ext,{targetW:src.targetW,smooth:src.smooth});
}

/** 新圖追加獨立圖層；重新分析時僅替換目前來源的物件。 */
function appendPaths(paths,center,replace) {
    const previous=job.objects.filter(o=>o.sourceId===source.id);
    const oldLayers=job.layers.filter(l=>l.sourceId===source.id);
    const old=new Map(oldLayers.map(l=>[l.key,l]));
    const groups=GordixImport.groupPaths(paths.filter(p=>p.points.length>=2),source.groupMode);
    if (replace) {
        job.objects=job.objects.filter(o=>o.sourceId!==source.id);
        // 跨來源物件可以移到同一圖層；重解析時保留仍被其他來源引用的圖層。
        job.layers=job.layers.filter(l=>l.sourceId!==source.id || job.objects.some(o=>o.layerId===l.id));
    }
    const layers=groups.map((g,i)=>old.get(g.key) || {
        id:'L'+layerSeq++,sourceId:source.id,key:g.key,
        name:g.key,color:source.groupMode==='color'?g.key:LAYER_COLORS[i%LAYER_COLORS.length],
        visible:true,op:'profile',toolId:firstFlat(),depth:3,through:false,tabs:false
    });
    job.layers.push(...layers.filter(l=>!job.layers.some(old=>old.id===l.id)));
    const added=[];
    const stable=replace && previous.length===paths.length;
    groups.forEach((g,i)=>g.paths.forEach(p=>{
        const index=paths.indexOf(p), prior=stable ? previous.find(o=>o.pathIndex===index) : null;
        const matrix=prior?.matrix || (replace && previous[0]?.matrix) || {a:1,b:0,c:0,d:1,e:center.x,f:center.y};
        added.push({...prior,id:prior?.id || ++objectSeq,sourceId:source.id,pathIndex:index,closed:p.closed,layerId:prior && !oldLayers.some(l=>l.id===prior.layerId) && job.layers.some(l=>l.id===prior.layerId) ? prior.layerId : layers[i].id,
            matrix:{...matrix},groupId:prior?.groupId || null,
            points:p.points.map(q=>({x:matrix.a*q.x+matrix.c*q.y+matrix.e,y:matrix.b*q.x+matrix.d*q.y+matrix.f}))});
    }));
    job.objects.push(...added);
    if (!stable) autoGroup(added);
    selObjs.clear();selLayerId=layers[0]?.id || null;
    if(selLayerId)expanded.add(selLayerId);
}

/** 調整來源尺寸或解析設定時，只重新處理該檔案。 */
async function importSource(keepCenter) {
    if (!source || importBusy) return;
    const version=++importVersion, src=source;
    const candidate={...src,targetW:+$('target-width').value || 100,smooth:+$('smooth').value || .1,
        threshold:+$('threshold').value,groupMode};
    let paths;
    sourcePending++;
    try { paths=await sourcePaths(candidate); } finally { sourcePending--; }
    if (version!==importVersion || source!==src) return;
    const members=job.objects.filter(o=>o.sourceId===src.id);
    const b=members.length ? selectionBox(members) : null;
    const center=keepCenter && b ? {x:(b.minX+b.maxX)/2,y:(b.minY+b.maxY)/2} : boardCenter;
    source=candidate;sources.set(source.id,source);
    appendPaths(paths,center,true);syncSource();rebuild();
}
let importTimer=0;
const reimport=()=>{clearTimeout(importTimer);importTimer=setTimeout(()=>importSource(true).catch(error=>{$('import-error').innerText=error.message;}),250);};

});

// ===== 刀路計算：gordix-cam.js 依圖層與刀具分檔 =====
// record = false：復原 / 重做時重算，不再記一筆
function rebuild(record = true) {
    job.thickness = stock.t;
    job.overcut = Math.max(0, parseFloat($('overcut').value) || 0);
    job.safeZ = Math.max(0.5, parseFloat($('safe-z').value) || 2);
    job.resolution = Math.max(0.05, parseFloat($('resolution').value) || 0.1);
    files = job.objects.length ? GordixCam.buildFiles(job, tools) : [];
    files = GordixRecovered.apply(files,job,tools);

}

function renderStock() {

// ===== 圖層清單與圖層設定 =====
function layerWarnings(l) {
    const L = T(), w = [], tool = toolById(l.toolId);
    if (isRouterOp(l.op) && !tool) w.push(L.warnNoTool);
    if (tool && isRouterOp(l.op) && !isCarveOp(l.op) && tool.type !== 'flat') w.push(L.warnBit);
    if (tool && l.op === 'vcarve' && tool.type === 'flat') w.push(L.warnVbit);
    if (job.issues && job.issues[l.id] === 'tooWide') w.push(L.warnTooWide);
    if (isRouterOp(l.op) && !l.through && l.depth >= job.thickness) w.push(L.warnThrough);
    return w;
}

/** 圖層眼睛只控制編輯預覽，不會變更加工輸出。 */
function objectShown(object) {
    const layer=job.layers.find(layer=>layer.id===object.layerId);
    return !!layer && !layer.hidden && !object.hidden;
}

/** 一個加工單元涉及被隱藏的圖形時，編輯畫面不顯示其刀路。 */
function unitShown(unit) {
    const layer=job.layers.find(layer=>layer.id===unit.layerId);
    return !!layer && !layer.hidden && (unit.objectIds || []).every(id=>{
        const object=job.objects.find(object=>object.id===id);
        return object && objectShown(object);
    });
}

/** 用原始物件的實際位置與形狀繪製小縮圖，長路徑只降低預覽取樣。 */
function layerThumbnail(objects,color) {
    if (!objects.length) return '<svg viewBox="0 0 40 32" aria-hidden="true"><path d="M8 16H32" stroke="currentColor" opacity=".25"/></svg>';
    const box=selectionBox(objects),span=Math.max(box.maxX-box.minX,box.maxY-box.minY,1),pad=span*.12;
    const d=objects.map(object=>{
        const layer=job.layers.find(layer=>layer.id===object.layerId);
        const points=GordixCam.objectPath(object,layer?.op),step=Math.max(1,Math.ceil(points.length/80));
        const sample=points.filter((_,i)=>i%step===0 || i===points.length-1);
        return sample.map((p,i)=>`${i?'L':'M'} ${p.x.toFixed(2)} ${(-p.y).toFixed(2)}`).join(' ')+(object.closed!==false?' Z':'');
    }).join(' ');
    return `<svg viewBox="${box.minX-pad} ${-box.maxY-pad} ${Math.max(box.maxX-box.minX,1)+pad*2} ${Math.max(box.maxY-box.minY,1)+pad*2}" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/** 顯示與隱藏使用相同尺寸的向量圖示，保留按鈕文字替代。 */
function eyeIcon(hidden) {
    return `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.4-7 10-7 10 7 10 7-3.4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>${hidden?'<path d="M3 3 21 21"/>':''}</svg>`;
}

/** 每個圖層列出實際物件；群組標題仍可一次選到整個群組。 */
function layerItems(layer) {
    const L=T(),seen=new Set(),groups=new Map();
    job.objects.forEach(object=>{if(object.groupId && !groups.has(object.groupId))groups.set(object.groupId,groups.size+1);});
    return job.objects.filter(object=>object.layerId===layer.id).map(object=>{
        let group='';
        if (object.groupId && !seen.has(object.groupId)) {
            seen.add(object.groupId);
            const members=groupOf(object);
            group=`<button class="layer-group" data-pick="g:${object.groupId}">${esc(fill(L.groupItem,{n:groups.get(object.groupId),c:members.length}))}</button>`;
        }
        const name=object.name || fill(L.objItem,{n:object.id});
        return group+`<div class="layer-object ${selObjs.has(object.id)?'selected':''}" data-object-id="${object.id}">
            <span data-drag-object="${object.id}" class="layer-drag" title="${L.dragLayer}" aria-hidden="true">⠿</span>
            <button data-pick="o:${object.id}" class="object-thumbnail ${object.hidden?'is-muted':''}" title="${L.pickObject}">${layerThumbnail([object],layer.color)}</button>
            <input data-act="object-name" class="object-name" value="${esc(name)}" aria-label="${L.objectName}" maxlength="80">
            <button data-act="eye-object" class="layer-eye" title="${L.eyeTip}" aria-label="${object.hidden?L.showObject:L.hideObject}" aria-pressed="${!object.hidden}">${eyeIcon(object.hidden)}</button>
            <input type="checkbox" data-act="output-object" ${object.enabled!==false?'checked':''} class="object-output" title="${L.outputObject}" aria-label="${L.outputObject}">
            <select data-act="move-object" class="layer-move" title="${L.moveLayer}" aria-label="${L.moveLayer}"><option value="">↪</option>${job.layers.map(target=>`<option value="${target.id}" ${target.id===layer.id?'disabled':''}>${esc(target.name)}</option>`).join('')}</select>
        </div>`;
    }).join('');
}

/** 明確搬移指定的物件；保留來源、群組、位置與輸出設定。 */
function moveObjectsToLayer(ids,targetId) {
    const target=job.layers.find(layer=>layer.id===targetId);
    if (!target) return;
    const moving=job.objects.filter(object=>ids.includes(object.id));
    if (!moving.length || moving.every(object=>object.layerId===targetId)) return;
    commit();moving.forEach(object=>{object.layerId=targetId;});
    selObjs.clear();moving.forEach(object=>selObjs.add(object.id));
    selLayerId=targetId;expanded.add(targetId);rebuild();
}

$('layer-list').addEventListener('click',event=>{
    if(event.target.closest('[data-drag-object]'))return;
    const row=event.target.closest('[data-layer]');if(!row)return;
    const layer=job.layers.find(layer=>layer.id===row.dataset.layer);
    const element=event.target.closest('[data-act]'),action=element?.dataset.act;
    const objectRow=event.target.closest('[data-object-id]');
    const object=objectRow && job.objects.find(object=>object.id===+objectRow.dataset.objectId);
    const pick=event.target.closest('[data-pick]');
    if(action==='expand'){expanded.has(layer.id)?expanded.delete(layer.id):expanded.add(layer.id);renderLayers();return;}
    if(action==='eye-layer'){layer.hidden=!layer.hidden;job.objects.filter(o=>o.layerId===layer.id).forEach(o=>selObjs.delete(o.id));rebuild();return;}
    if(action==='eye-object'){object.hidden=!object.hidden;selObjs.delete(object.id);rebuild();return;}
    if(action==='visible'){layer.visible=element.checked;rebuild();return;}
    if(action==='output-object'){object.enabled=element.checked;rebuild();return;}
    if(action==='move-object')return;
    if(pick){
        const [kind,id]=pick.dataset.pick.split(':');
        const objects=kind==='g'?job.objects.filter(o=>o.groupId===id):job.objects.filter(o=>o.id===+id);
        if(!event.shiftKey && !event.ctrlKey && !event.metaKey)selObjs.clear();
        const remove=(event.shiftKey || event.ctrlKey || event.metaKey) && objects.every(o=>selObjs.has(o.id));
        objects.forEach(o=>remove?selObjs.delete(o.id):selObjs.add(o.id));selLayerId=layer.id;renderAll();return;
    }
    selLayerId=layer.id;selObjs.clear();
    (object?[object]:job.objects.filter(o=>o.layerId===layer.id)).forEach(o=>selObjs.add(o.id));
    if(action==='layer-name' || action==='object-name'){updateLayerSelectionView();return;}
    renderAll();
});

// 使用指標拖曳而非原生 HTML 拖放，避免欄位失焦重畫時中斷拖曳。

    const handle=event.target.closest('[data-drag-object]');if(!handle || event.button!==0)return;
    event.preventDefault();
    const id=+handle.dataset.dragObject;
    layerDrag={pointer:event.pointerId,x:event.clientX,y:event.clientY,ids:selObjs.has(id)?[...selObjs]:[id],moved:false,target:null};

function toolAdviceLines(t) {

function selectionBox(objs) {
    const b = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
    objs.forEach(o => o.points.forEach(p => {
        b.minX = Math.min(b.minX, p.x); b.maxX = Math.max(b.maxX, p.x);
        b.minY = Math.min(b.minY, p.y); b.maxY = Math.max(b.maxY, p.y);
    }));
    return b;
}
const selected = () => job.objects.filter(o => selObjs.has(o.id));
function transformSel(fn) {
    // 目前的移動、等比縮放與旋轉都是仿射轉換，保留矩陣讓重新解析也能沿用擺放。
    const p=fn({x:0,y:0}),x=fn({x:1,y:0}),y=fn({x:0,y:1});
    const a=x.x-p.x,b=x.y-p.y,c=y.x-p.x,d=y.y-p.y;
    selected().forEach(o=>{
        const m=o.matrix || {a:1,b:0,c:0,d:1,e:0,f:0};
        o.matrix={a:a*m.a+c*m.b,b:b*m.a+d*m.b,c:a*m.c+c*m.d,d:b*m.c+d*m.d,
            e:a*m.e+c*m.f+p.x,f:b*m.e+d*m.f+p.y};
        o.points=o.points.map(fn);
    });
}

function rotateSel(degrees,center) {

const pathD = (pts, close) => 'M' + pts.map(sv).join('L') + (close ? 'Z' : '');
let dragging = false;

// 全景：整個工作台；design = true 時對準加工物件（外加 40% 邊界，至少 300 mm 寬，看得到周圍的板材）
function fitView(design) {
    const r = ws.getBoundingClientRect();
    if (!r.width || !r.height) return;
    let minX, maxX, minY, maxY, pad = 1.1;
    if (design && job.objects.length) {
        const b = selectionBox(job.objects), cx = (b.minX + b.maxX) / 2, half = Math.max(150, (b.maxX - b.minX) * 0.7);
        const cy = -(b.minY + b.maxY) / 2, halfY = Math.max(100, (b.maxY - b.minY) * 0.7);
        [minX, maxX, minY, maxY, pad] = [cx - half, cx + half, cy - halfY, cy + halfY, 1];
    } else {
        const jig = Object.values(GordixTable.corners(table));
        [minX, maxX] = [Math.min(...jig.map(p => p.x)), Math.max(...jig.map(p => p.x))];
        [minY, maxY] = [Math.min(...jig.map(p => -p.y)), Math.max(...jig.map(p => -p.y))];
    }
    const aspect = r.width / r.height;
    view.w = Math.max((maxX - minX) * pad, (maxY - minY) * 1.2 * aspect);
    view.h = view.w / aspect;
    view.x = (minX + maxX) / 2 - view.w / 2;
    view.y = (minY + maxY) / 2 - view.h / 2;
    render2D();
}
function toSvg(cx, cy) {
    const r = ws.getBoundingClientRect();
    return { x: view.x + (cx - r.left) / r.width * view.w, y: view.y + (cy - r.top) / r.height * view.h };
}
function zoomAt(cx, cy, factor) {
    const p = toSvg(cx, cy), w = Math.min(Math.max(view.w / factor, 10), 20000), k = w / view.w;
    view.x = p.x - (p.x - view.x) * k; view.y = p.y - (p.y - view.y) * k;
    view.w = w; view.h *= k;
    render2D();
}

function render2D() {
    if (is3d) return;
    ws.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
    const u = view.w / (ws.clientWidth || 1), L = T(), nss = 'vector-effect="non-scaling-stroke"';
    const isDark = document.documentElement.classList.contains('dark');
    const s = [GordixWorkspace.staticSvg({ table, board: {...stock,on:stock.on && $('opt-stock-model').checked}, u, isDark, labels: { tableName: L.tableName, front: L.front, legendRange: L.legendRange, legendBoard: L.legendBoard } })];
    const layerOf = id => job.layers.find(l => l.id === id) || {};
    const zone = { x: range.x / 2, y: range.y / 2 };   // 加工範圍中央、長寬各一半
    if ($('opt-zone').checked) {
        s.push(`<rect x="${-zone.x}" y="${-zone.y}" width="${zone.x * 2}" height="${zone.y * 2}" fill="rgba(16,185,129,0.06)" stroke="#10b981" stroke-width="1" stroke-dasharray="2 4" ${nss} pointer-events="none"/>`);
        s.push(GordixWorkspace.svgText(-zone.x + 4 * u, zone.y - 5 * u, L.zone, 9 * u, '#10b981', 'start', 'normal'));
    }
    if (layout && !dragging) {
        s.push(`<path d="${layout.strokes.map(p => pathD(p, false)).join('')}" fill="none" stroke="#a855f7" stroke-width="1.5" ${nss} pointer-events="none"/>`);
    }

    // 刀路（拖曳中先不畫，放開後重算）
    if (!dragging) {
        files.forEach(f => (f.displayUnits || f.units).forEach(un => {
            if(!unitShown(un))return;
            const l = layerOf(un.layerId), d = f.tool ? f.tool.d : 0.3;
            const dd = un.phases.flatMap(ph => ph.paths.filter(p => p.length > 1).map(p => pathD(p, false))).join('');
            if ($('opt-width').checked) s.push(`<path d="${dd}" fill="none" stroke="${l.color}" stroke-opacity="0.22" stroke-width="${d}" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>`);
            s.push(`<path d="${dd}" fill="none" stroke="${l.color}" stroke-width="1" stroke-dasharray="4 2" ${nss} pointer-events="none"/>`);
        }));
    }
    // 物件：大的先畫，被包住的小圖形在上面才點得到
    const area = o => { const b = selectionBox([o]); return (b.maxX - b.minX) * (b.maxY - b.minY); };
    job.objects.filter(objectShown).sort((a, b) => area(b) - area(a)).forEach(o => {
        const l = layerOf(o.layerId), sel = selObjs.has(o.id), dim = !l.visible || (selLayerId && o.layerId !== selLayerId && !sel);
        s.push(`<path data-obj="${o.id}" d="${pathD(GordixCam.objectPath(o,l.op), l.op!=='laserLine' || o.closed!==false)}" fill="${sel ? 'rgba(250,204,21,0.12)' : 'rgba(0,0,0,0.001)'}" stroke="${sel ? '#facc15' : l.color}"
            stroke-width="${sel ? 2.5 : 1.5}" stroke-opacity="${dim ? 0.35 : 1}" ${l.visible ? '' : 'stroke-dasharray="3 3"'} ${nss} style="cursor:move"/>`);
    });
    // 加工順序（跨檔連號）
    if ($('opt-order').checked && !dragging) {
        let n = 1;
        files.forEach(f => (f.displayUnits || f.units).forEach(un => {
            const order=n++;if(!unitShown(un))return;
            const ph = un.phases.find(p => p.paths.length && p.paths[0].length), p = ph && ph.paths[0][0];
            if (!p) return;
            s.push(`<circle cx="${p.x}" cy="${-p.y}" r="${8 * u}" fill="#ffffff" stroke="#0f172a" stroke-width="1" ${nss} pointer-events="none"/>`);
            s.push(GordixWorkspace.svgText(p.x, -p.y + 3.5 * u, order, 10 * u, '#0f172a'));
        }));
    }
    // 機器底面 250 × 250（刀頭在選取物件中心時）
    if ($('opt-foot').checked && job.objects.some(objectShown)) {
        const b = selectionBox(selObjs.size ? selected() : job.objects), cx = (b.minX + b.maxX) / 2, cy = (b.minY + b.maxY) / 2;
        s.push(`<rect x="${cx - 125}" y="${-cy - 125}" width="250" height="250" fill="rgba(239,68,68,0.06)" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 4" ${nss} pointer-events="none"/>`);
        s.push(GordixWorkspace.svgText(cx, -cy - 125 - 4 * u, L.foot, 10 * u, '#ef4444'));
    }
    // 動畫進度：已切 / 未切 / 空跑與刀具位置
    const st = player && player.state();
    if (st && merged && st.n < merged.moves.length) {
        const g = GordixPreview.svg2d(merged, st.n);
        s.push(`<path d="${g.todo}" fill="none" stroke="#94a3b8" stroke-width="1.5" ${nss} pointer-events="none"/>`,
            `<path d="${g.travel}" fill="none" stroke="#f97316" stroke-width="1" stroke-dasharray="4 3" ${nss} pointer-events="none"/>`,
            `<path d="${g.done}" fill="none" stroke="#2563eb" stroke-width="2" ${nss} pointer-events="none"/>`);
        const h = headAt(st);
        s.push(`<circle cx="${h.x}" cy="${-h.y}" r="${6 * u}" fill="#dc2626" ${nss} pointer-events="none"/>`);
    }
    if (selected().some(objectShown)) {
        const b=selectionBox(selected().filter(objectShown)),cx=(b.minX+b.maxX)/2;
        s.push(`<line x1="${cx}" y1="${-b.maxY}" x2="${cx}" y2="${-b.maxY-28*u}" stroke="#facc15" ${nss} pointer-events="none"/>`);
        s.push(`<circle id="cnc-rotate" cx="${cx}" cy="${-b.maxY-28*u}" r="${7*u}" fill="white" stroke="#facc15" stroke-width="2" ${nss} style="cursor:grab"/>`);
    }
    if ($('opt-tabs').checked) {
        files.flatMap(fileTabMarkers).filter(unitShown).forEach(marker=>{
            s.push(`<circle data-tab-marker="1" cx="${marker.x}" cy="${-marker.y}" r="${Math.max(5*u,marker.radius)}" fill="rgba(245,158,11,.28)" stroke="#f59e0b" stroke-width="2.5" ${nss} pointer-events="none"/>`);
        });
    }
    ws.innerHTML = s.join('');

    // 位置警告：超出加工範圍（紅）、超出板材（橘）；只提示，不擋下載
    const warns = [];
    if (job.objects.length) {
        const b = selectionBox(job.objects.filter(o => layerOf(o.layerId).visible));
        if (b.minX < -range.x || b.maxX > range.x || b.minY < -range.y || b.maxY > range.y) warns.push(['bg-red-600', L.warnRange]);
        const corners = [{ x: b.minX, y: b.minY }, { x: b.maxX, y: b.minY }, { x: b.maxX, y: b.maxY }, { x: b.minX, y: b.maxY }];
        if (boardPoly && !corners.every(p => GordixTable.insidePolygon(p, boardPoly))) warns.push(['bg-amber-500', L.warnBoard]);
        if ($('opt-zone').checked && (b.minX < -zone.x || b.maxX > zone.x || b.minY < -zone.y || b.maxY > zone.y)) warns.push(['bg-sky-600', L.warnZone]);
    }
    $('ws-warning').innerHTML = warns.map(([c, m]) => `<span class="${c} text-white text-[11px] font-bold px-3 py-1 rounded-lg shadow">${m}</span>`).join('');
}

// 滑鼠 / 觸控：點圖形選取、拖曳移動；拖空白處平移；滾輪或雙指縮放；雙擊空白處回全景
const drag = { mode: null, last: null, moved: false, pointers: new Map(), pinch: 0 };
ws.addEventListener('pointerdown', e => {
    ws.setPointerCapture(e.pointerId);
    drag.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (drag.pointers.size === 2) {
        const [a, b] = [...drag.pointers.values()];
        drag.mode = 'pinch'; drag.pinch = Math.hypot(a.x - b.x, a.y - b.y);
        return;
    }
    if (e.target.id==='cnc-rotate' && selected().length) {
        const b=selectionBox(selected()),p=toSvg(e.clientX,e.clientY);
        drag.center={x:(b.minX+b.maxX)/2,y:(b.minY+b.maxY)/2};
        drag.angle=Math.atan2(-p.y-drag.center.y,p.x-drag.center.x)*180/Math.PI;
        drag.mode='rotate';drag.moved=false;return;
    }
    const el = e.target.closest('[data-obj]');
    drag.moved = false;
    drag.last = toSvg(e.clientX, e.clientY);
    // 雙擊自己判斷（第一下點擊會重畫預覽，瀏覽器的 dblclick 事件不會觸發）：0.4 秒內同一處點兩下
    const now = performance.now(), key = el ? el.dataset.obj : 'empty';
    const dbl = drag.tap && drag.tap.key === key && now - drag.tap.t < 400 && Math.hypot(e.clientX - drag.tap.x, e.clientY - drag.tap.y) < 8;
    drag.tap = dbl ? null : { key, t: now, x: e.clientX, y: e.clientY };
    if (dbl && !el) { drag.mode = null; fitView(); return; }          // 雙擊空白處：回到全景
    if (dbl && el) {                                                   // 雙擊群組裡的物件：只選它
        selObjs.clear(); selObjs.add(+el.dataset.obj);
        drag.mode = 'move';
        renderAll();
        return;
    }
    if (el) {
        const id = +el.dataset.obj, o = job.objects.find(x => x.id === id), members = e.altKey ? [o] : groupOf(o);
        if (e.shiftKey) {
            const all = members.every(m => selObjs.has(m.id));
            members.forEach(m => all ? selObjs.delete(m.id) : selObjs.add(m.id));
        } else if (!selObjs.has(id)) { selObjs.clear(); members.forEach(m => selObjs.add(m.id)); }
        selLayerId = job.objects.find(o => o.id === id).layerId;
        drag.mode = 'move';
        renderAll();
    } else {
        drag.mode = 'pan';
        drag.client = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
    }
});
ws.addEventListener('pointermove', e => {
    if (!drag.pointers.has(e.pointerId)) return;
    drag.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (drag.mode === 'pinch' && drag.pointers.size === 2) {
        const [a, b] = [...drag.pointers.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
        if (drag.pinch) zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, d / drag.pinch);
        drag.pinch = d;
        return;
    }
    if (drag.mode==='rotate') {
        const p=toSvg(e.clientX,e.clientY);
        const angle=Math.atan2(-p.y-drag.center.y,p.x-drag.center.x)*180/Math.PI;
        let delta=angle-drag.angle;
        if (e.shiftKey) delta=Math.round(delta/15)*15;
        rotateSel(delta,drag.center);drag.angle+=delta;drag.moved=true;dragging=true;
        renderObjPanel();render2D();
    } else if (drag.mode === 'move') {
        const p = toSvg(e.clientX, e.clientY), dx = p.x - drag.last.x, dy = -(p.y - drag.last.y);
        if (!dx && !dy) return;
        drag.last = p; drag.moved = true; dragging = true;
        transformSel(q => ({ x: q.x + dx, y: q.y + dy }));
        render2D();
    } else if (drag.mode === 'pan') {
        const r = ws.getBoundingClientRect();
        view.x = drag.client.vx - (e.clientX - drag.client.x) / r.width * view.w;
        view.y = drag.client.vy - (e.clientY - drag.client.y) / r.height * view.h;
        drag.moved = true;
        render2D();
    }
});
const endDrag = e => {
    drag.pointers.delete(e.pointerId);
    if (drag.mode === 'pan' && !drag.moved && !e.shiftKey && selObjs.size) { selObjs.clear(); renderAll(); }
    if (['move','rotate'].includes(drag.mode) && drag.moved) { dragging = false; rebuild(); }
    dragging = false;
    if (!drag.pointers.size) drag.mode = null;
};
ws.addEventListener('pointerup', endDrag);
ws.addEventListener('pointercancel', endDrag);
ws.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.pow(1.1, -e.deltaY / 100)); }, { passive: false });
['opt-width', 'opt-order', 'opt-foot', 'opt-zone'].forEach(id => $(id).onchange = render2D);
$('opt-tabs').onchange=()=>{syncTabMarkers();render2D();};
$('opt-stock-model').onchange=()=>{if(simObj)simObj.group.visible=$('opt-stock-model').checked;if(view3d)view3d.render();render2D();};
$('btn-fit').onclick = () => { is3d ? view3d.setTop(false) : fitView(); };

// ===== 預覽：所有檔接在一起播放（每段帶自己的刀具），3D 加切削模擬 =====
let is3d = false, view3d = null, merged = null, player = null, bar = null, sim = null, simObj = null;
let previewTimer = 0, want = null, busy = false, drawnAt = 0;
const simTool = t => ({ type: t.type, d: t.d, angle: t.angle });

function mergeFiles() {
    const lines = [], moves = [];
    files.forEach(f => {
        const p = GordixPreview.parse(f.gcode), off = lines.length, tool = f.head === 'router' ? simTool(f.tool) : null;
        p.moves.forEach(m => moves.push(Object.assign({}, m, { line: m.line + off, tool })));
        lines.push(...p.lines);
    });
    return { lines, moves, starts: GordixPreview.strokeStarts(moves), hasZ: true };
}

function schedulePreview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(rebuildPreview, 300);
}

function rebuildPreview() {
    merged = files.length ? mergeFiles() : null;
    $('player').classList.toggle('hidden', !merged);
    player = null; sim = null;
    if (simObj) { if (view3d) view3d.setSim(null); simObj.dispose(); simObj = null; }
    if (!merged) {if(is3d)build3d();else render2D();return;}
    player = GordixPreview.Player(merged).on(s => { want = s; pump(); });
    bar = GordixPreview.PlayerBar($('player'), player, currentLang);
    if (is3d) build3d();
    want = player.state();
    pump();
}

function outlines() {
    const out = [[{ x: -range.x, y: -range.y }, { x: range.x, y: -range.y }, { x: range.x, y: range.y }, { x: -range.x, y: range.y }]];
    if (boardPoly) out.push(boardPoly);
    return out;
}

/** 建立完整毛胚體積；切削區域由高度圖填入，外部保留原板材。 */
function createStockDisplay(cutSimulation) {
    const group=new THREE.Group(),cut=cutSimulation ? GordixSim.Mesh(cutSimulation,THREE) : null;
    if (cut) group.add(cut.group);
    if (boardPoly) {
        const scale=1000,polygon=points=>points.map(p=>({X:Math.round(p.x*scale),Y:Math.round(p.y*scale)}));
        const clipper=new ClipperLib.Clipper(),tree=new ClipperLib.PolyTree();
        clipper.AddPath(polygon(boardPoly),ClipperLib.PolyType.ptSubject,true);
        if (cutSimulation) {
            const {x0,y0,nx,ny,res}=cutSimulation,x1=x0+(nx-1)*res,y1=y0+(ny-1)*res;
            clipper.AddPath(polygon([{x:x0,y:y0},{x:x1,y:y0},{x:x1,y:y1},{x:x0,y:y1}]),ClipperLib.PolyType.ptClip,true);
        }
        clipper.Execute(ClipperLib.ClipType.ctDifference,tree,ClipperLib.PolyFillType.pftEvenOdd,ClipperLib.PolyFillType.pftEvenOdd);
        const outline=(path,shape)=>{path.forEach((p,i)=>{i ? shape.lineTo(p.X/scale,p.Y/scale) : shape.moveTo(p.X/scale,p.Y/scale);});shape.closePath();return shape;};
        ClipperLib.JS.PolyTreeToExPolygons(tree).forEach(poly=>{
            const shape=outline(poly.outer,new THREE.Shape());
            poly.holes.forEach(hole=>shape.holes.push(outline(hole,new THREE.Path())));
            const geometry=new THREE.ExtrudeGeometry(shape,{depth:stock.t,bevelEnabled:false,steps:1});
            const material=new THREE.MeshLambertMaterial({color:0xd8b985,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
            const mesh=new THREE.Mesh(geometry,material);mesh.position.z=-stock.t;group.add(mesh);
        });
    }
    group.visible=$('opt-stock-model').checked;
    return {group,update(){if(cut)cut.update();},dispose(){group.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});}};
}

function build3d() {
    if (!view3d) {view3d=GordixPreview.View3D($('view3d'));view3d.resize();}
    if(simObj){view3d.setSim(null);simObj.dispose();simObj=null;}
    view3d.setMoves(merged || {moves:[],hasZ:true},outlines());
    if (merged && merged.moves.some(m=>m.tool)) {
        sim=GordixSim.create(merged.moves,merged.moves.find(m=>m.tool).tool,stock.t);
        if(boardPoly)sim.contains=(x,y)=>GordixTable.insidePolygon({x,y},boardPoly);
    }
    simObj=createStockDisplay(sim);
    view3d.setSim(simObj);syncTabMarkers();
}

/** 同一份橋位資料供2D與3D標示。 */
function fileTabMarkers(file){return file.recoveredMarkers ?? GordixCam.tabMarkers(file.units);}
function syncTabMarkers(){if(view3d)view3d.setMarkers($('opt-tabs').checked?files.flatMap(fileTabMarkers):[]);}


function headAt(st) {
    const mv = merged.moves, a = mv[st.n - 1] || { x: 0, y: 0, z: job.safeZ }, b = mv[st.n];
    return b ? { x: a.x + (b.x - a.x) * st.frac, y: a.y + (b.y - a.y) * st.frac, z: a.z + (b.z - a.z) * st.frac } : a;
}

// 依播放位置更新：3D 算模擬（每個畫面最多 12 ms，沒算完下個畫面繼續），2D 畫進度；每 0.08 秒最多重畫一次
function pump() {
    if (!want || !merged) return;
    const now = performance.now();
    let finished = true;
    if (is3d && sim) finished = GordixSim.advance(sim, want.n, want.frac, now + 12);
    if (finished || now - drawnAt > 80) {
        drawnAt = now;
        if (is3d && view3d) view3d.setProgress(want.n, want.frac);
        else render2D();
    }
    if (!finished && !busy) { busy = true; requestAnimationFrame(() => { busy = false; pump(); }); }
}

function setView(on3d) {
    if (on3d && typeof THREE === 'undefined') return;
    is3d = on3d;
    ws.classList.toggle('hidden', on3d);
    $('view3d').classList.toggle('hidden', !on3d);
    $('btn-top').classList.toggle('hidden', !on3d);
    ['opt-width', 'opt-order', 'opt-foot', 'opt-zone'].forEach(id => $(id).parentElement.classList.toggle('hidden', on3d));
    $('view-2d').classList.toggle('on', !on3d);
    $('view-3d').classList.toggle('on', on3d);
    if (on3d) {
        if (!view3d) build3d();
        else if (merged && !sim && merged.moves.some(m => m.tool)) build3d();
        view3d.resize();
        if (want) { drawnAt = 0; pump(); }
    } else render2D();
}
$('view-2d').onclick = () => setView(false);
$('view-3d').onclick = () => setView(true);
$('btn-top').onclick = () => view3d && view3d.setTop(true);
$('btn-undo').onclick = undo;
$('btn-redo').onclick = redo;
document.addEventListener('keydown', e => {
    const t = e.target;
    if ((t.tagName === 'INPUT' && !['checkbox', 'range', 'file'].includes(t.type)) || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT') return;
    const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (mod && k === 'y') { e.preventDefault(); redo(); }
    else if (mod && k === 'g') { e.preventDefault(); e.shiftKey ? ungroupSel() : groupSel(); }
    else if (mod && k === 'a' && job.objects.length) { e.preventDefault(); job.objects.forEach(o => selObjs.add(o.id)); renderAll(); }
    else if ((k === 'delete' || k === 'backspace') && selObjs.size) { e.preventDefault(); $('op-delete').click(); }
    else if (k === 'escape' && selObjs.size) { selObjs.clear(); renderAll(); }
});

// ===== 語言、主題、進階 =====
function applyLang() {
    const L = T();
    document.querySelectorAll('[data-i18n]').forEach(el => { el.innerText = L[el.dataset.i18n]; });
    $('lang-toggle').innerText = L.lang;
    if (!source) $('file-name').innerText = L.noFile;
    renderAdvanced();
    renderAll();
    if (bar) bar.setLang(currentLang);
}
$('lang-toggle').onclick = () => {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    localStorage.setItem('gordix-lang', currentLang);
    applyLang();
};
function setTheme(theme) {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    $('theme-icon').innerHTML = theme === 'dark'
        ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z" />'
        : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />';
    localStorage.setItem('gordix-theme', theme);
    render2D();
}
$('theme-toggle').onclick = () => setTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
const ADVANCED_KEY = 'gordix-advanced';
function renderAdvanced() {
    const on = document.body.classList.contains('show-advanced');
    $('advanced-toggle').innerText = on ? T().advOn : T().advOff;
    $('advanced-toggle').className = 'px-3 py-1.5 rounded-lg text-[11px] font-bold border border-white/20 ' + (on ? 'bg-white text-orange-600' : 'bg-white/10 hover:bg-white/20');
}
$('advanced-toggle').onclick = () => {
    const on = !document.body.classList.contains('show-advanced');
    document.body.classList.toggle('show-advanced', on);
    try { localStorage.setItem(ADVANCED_KEY, on ? '1' : '0'); } catch (e) { }
    renderAdvanced();
};
try { document.body.classList.toggle('show-advanced', localStorage.getItem(ADVANCED_KEY) === '1'); } catch (e) { }

new ResizeObserver(() => { if (is3d && view3d) view3d.resize(); else if (view.w <= 1) fitView(); else render2D(); }).observe($('preview-box'));
setTheme(localStorage.getItem('gordix-theme') || 'dark');
setView(false);
applyLang();
fitView();
commit();

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => { }));
}
</script>
