<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        .num-field { display: flex; flex-direction: column; gap: 2px; font-size: 11px; font-weight: 700; color: #64748b; }
        .num-wrap { position: relative; display: block; }
        .num-wrap::after {
            content: attr(data-unit); position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            font-size: 10px; color: #94a3b8; pointer-events: none;
        }
        .num-in {
            width: 100%; padding: 7px 30px 7px 8px; border-radius: 6px; outline: none;
            font-family: ui-monospace, Consolas, monospace; font-size: 13px;
            background: #ffffff; border: 1px solid #cbd5e1; color: #1e293b;
        }
        .dark .num-in { background: #1e293b; border-color: #334155; color: #ffffff; }
        .num-in:disabled { opacity: 0.4; }
        select.num-in { padding-right: 8px; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        #preview text { font-family: ui-monospace, Consolas, monospace; user-select: none; }
        .seg { padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; border: 1px solid #cbd5e1; color: #475569; }
        .dark .seg { border-color: #334155; color: #94a3b8; }
        .seg.on { background: #f59e0b; border-color: #f59e0b; color: #ffffff; }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen p-4 md:p-8 text-slate-800 dark:text-slate-200 font-sans transition-colors duration-300">
    <div class="max-w-7xl mx-auto bg-white dark:bg-slate-900 rounded-2xl shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-800">
        <!-- Header -->
        <div class="bg-gradient-to-r from-amber-600 to-orange-800 p-4 md:p-6 gap-3 text-white flex justify-between items-center">
            <div>
                <div data-i18n="stepLabel" class="text-[11px] font-bold text-white/70"></div>
                <h1 data-i18n="title" class="text-lg md:text-2xl font-black tracking-tight"></h1>
            </div>
            <div class="flex gap-2 md:gap-3 items-center shrink-0">
                <a href="index.html" class="flex items-center justify-center text-white/80 hover:text-white bg-white/10 hover:bg-white/20 p-1.5 rounded-lg border border-white/20" title="首頁 / Home">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="20" y1="12" x2="4" y2="12"></line><polyline points="10 18 4 12 10 6"></polyline></svg>
                </a>
                <button id="theme-toggle" class="p-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white border border-white/20" aria-label="Toggle Theme">
                    <svg id="theme-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"></svg>
                </button>
                <button id="lang-toggle" class="whitespace-nowrap px-3 py-1.5 rounded-lg text-[11px] font-bold bg-white/10 hover:bg-white/20 text-white border border-white/20">
                    <span id="lang-toggle-text">中文 / EN</span>
                </button>
            </div>
        </div>

        <main class="grid grid-cols-1 lg:grid-cols-[360px_1fr] gap-6 p-4 md:p-6">
            <!-- 設定 -->
            <div class="space-y-4 min-w-0">
                <!-- 工作台 -->
                <section class="p-4 bg-slate-100 dark:bg-slate-950/50 rounded-xl border border-slate-200 dark:border-slate-800 space-y-2">
                    <div class="flex justify-between items-center">
                        <label data-i18n="labelTable" class="text-[11px] font-black text-slate-500 dark:text-slate-400 tracking-widest"></label>
                        <a href="table_conf.html" data-i18n="linkTable" class="text-[11px] font-bold text-blue-600 dark:text-blue-400 hover:underline"></a>
                    </div>
                    <select id="table-select" class="num-in"></select>
                    <div id="table-info" class="text-[11px] font-mono text-slate-600 dark:text-slate-300"></div>
                    <div id="table-unset" data-i18n="tableUnset" class="hidden text-[11px] font-bold text-amber-600 dark:text-amber-400"></div>
                </section>

                <!-- 板材 -->
                <section class="p-4 bg-amber-50 dark:bg-amber-950/20 rounded-xl border border-amber-200 dark:border-amber-500/20 space-y-3">
                    <div class="flex justify-between items-center">
                        <label data-i18n="labelBoard" class="text-[11px] font-black text-amber-700 dark:text-amber-400 tracking-widest"></label>
                        <label class="flex items-center gap-2 text-[11px] font-bold text-slate-600 dark:text-slate-300">
                            <span data-i18n="boardOn"></span>
                            <input type="checkbox" id="board-on" class="w-4 h-4 accent-amber-500">
                        </label>
                    </div>
                    <div id="board-fields" class="space-y-3">
                        <div class="grid grid-cols-2 gap-2">
                            <label class="num-field col-span-2"><span data-i18n="boardSize"></span><select id="board-size" class="num-in"></select></label>
                            <label class="num-field"><span data-i18n="boardW"></span><span class="num-wrap" data-unit="mm"><input type="number" id="board-w" class="num-in" min="1" step="1"></span></label>
                            <label class="num-field"><span data-i18n="boardH"></span><span class="num-wrap" data-unit="mm"><input type="number" id="board-h" class="num-in" min="1" step="1"></span></label>
                            <button id="board-rotate" data-i18n="boardRotate" class="col-span-2 py-1.5 rounded text-[11px] font-bold bg-amber-500/20 text-amber-700 dark:text-amber-300 hover:bg-amber-500/30"></button>
                            <label class="num-field col-span-2"><span data-i18n="boardT"></span><span class="num-wrap" data-unit="mm"><input type="number" id="board-t" class="num-in" min="0.1" step="0.1"></span></label>
                        </div>

                        <div>
                            <div data-i18n="boardPos" class="text-[11px] font-bold text-slate-500 mb-1"></div>
                            <div class="flex gap-2">
                                <button data-mode="size" data-i18n="modeSize" class="seg"></button>
                                <button data-mode="measure" data-i18n="modeMeasure" class="seg"></button>
                            </div>
                        </div>

                        <!-- 量測實際位置：每個角到兩個治具的直線距離（三角定位） -->
                        <div id="measure-fields" class="space-y-2">
                            <p data-i18n="boardTip" class="text-[11px] text-slate-500 dark:text-slate-400"></p>
                            <div id="board-corner-inputs" class="space-y-2"></div>
                        </div>
                        <div id="board-summary" class="text-[11px] font-mono text-amber-700 dark:text-amber-300 leading-relaxed whitespace-pre-line"></div>
                    </div>
                </section>

                <a href="index.html#step-3" id="btn-next" data-i18n="next" class="block text-center w-full py-3 rounded-xl font-black bg-orange-500 hover:bg-orange-400 text-white"></a>
            </div>

            <!-- 預覽 -->
            <div class="min-w-0 space-y-2">
                <div class="relative rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 overflow-hidden" style="height: min(70vh, 640px)">
                    <svg id="preview" class="w-full h-full" xmlns="http://www.w3.org/2000/svg"></svg>
                </div>
                <div class="flex flex-wrap gap-x-4 gap-y-1 text-[11px] font-bold text-slate-500 dark:text-slate-400">
                    <span class="flex items-center gap-1.5"><span class="inline-block w-4 border-t-2 border-dashed border-sky-500"></span><span data-i18n="legendRange"></span></span>
                    <span class="flex items-center gap-1.5"><span class="inline-block w-3 h-3 rounded-sm bg-amber-700/40 border border-amber-500"></span><span data-i18n="legendBoard"></span></span>
                    <span class="flex items-center gap-1.5"><span class="inline-block w-3 h-3 rounded-sm border border-amber-500" style="background: repeating-linear-gradient(45deg, #f59e0b 0 1px, transparent 1px 4px)"></span><span data-i18n="legendOut"></span></span>
                </div>
            </div>
        </main>
    </div>

    <script src="gordix-table.js?v=6"></script>
    <script src="gordix-workspace.js?v=6"></script>
    <script>
        const i18n = {
            zh: {
                stepLabel: '步驟 2', title: '毛胚設定',
                labelTable: '工作台', linkTable: '修改工作台尺寸 →', tableName: '工作台',
                tableUnset: '尚未在桌長配置產生器設定，目前使用預設尺寸',
                labelBoard: '板材', boardOn: '使用板材', boardSize: '尺寸', custom: '自訂',
                boardW: '長（沿 S 邊，東西向）', boardH: '寬（沿 E 邊，南北向）', boardRotate: '轉 90°',
                boardT: '厚度', boardPos: '位置', modeSize: '工作台正中央', modeMeasure: '量測實際位置',
                boardTip: '用捲尺量板材每個角到兩個治具的直線距離。N 側的兩個角量 NW、NE 治具；S 側的兩個角量 SW、SE 治具。',
                boardCorner: '角', jig: '治具', boardEdges: '板材四邊',
                boardUnlocated: '角無法定位：兩段距離對不上（相加比兩治具間距短，或相差太多），請重新量測',
                rangeLine: '加工範圍 {w} × {h} mm', outNote: '斜線部分在加工範圍外，機器碰不到。', inNote: '整塊板材都在加工範圍內。',
                legendRange: '加工範圍', legendBoard: '板材', legendOut: '機器碰不到', front: '前側',
                next: '下一步：選加工方式 →'
            },
            en: {
                stepLabel: 'Step 2', title: 'Stock setup',
                labelTable: 'Table', linkTable: 'Edit table size →', tableName: 'Table',
                tableUnset: 'Not set in Table Configurator yet, using default size',
                labelBoard: 'Board', boardOn: 'Use board', boardSize: 'Size', custom: 'Custom',
                boardW: 'Length (along side S, east–west)', boardH: 'Width (along side E, north–south)', boardRotate: 'Rotate 90°',
                boardT: 'Thickness', boardPos: 'Position', modeSize: 'Table center', modeMeasure: 'Measured position',
                boardTip: 'Tape-measure the straight distance from each board corner to two jigs. The two N-side corners use the NW and NE jigs; the two S-side corners use the SW and SE jigs.',
                boardCorner: 'corner', jig: 'jig', boardEdges: 'Board edges',
                boardUnlocated: 'cannot be located: the two distances don\'t fit (sum shorter than the jig spacing, or too different). Please re-measure.',
                rangeLine: 'Work range {w} × {h} mm', outNote: 'Hatched areas are outside the work range; the machine cannot reach them.', inNote: 'The whole board is inside the work range.',
                legendRange: 'Work range', legendBoard: 'Board', legendOut: 'Out of reach', front: 'Front',
                next: 'Next: choose a process →'
            }
        };
        let currentLang = localStorage.getItem('gordix-lang') || 'zh';

        // 毛胚設定：讀進來就是全部狀態，任何修改立刻存回去
        const board = GordixTable.loadBoard();
        const $ = id => document.getElementById(id);
        const tableInfo = () => GordixTable.boardTable(board);
        const save = () => GordixTable.saveBoard(board);
        let pickedCustom = false; // 選了「自訂」但還沒改尺寸時，選單維持顯示自訂

        // 由 w、h 比對常用尺寸（兩個方向都算），比對不到就是自訂
        function sizePreset() {
            const p = GordixTable.BOARD_SIZES.find(s => (s.w === board.w && s.h === board.h) || (s.w === board.h && s.h === board.w));
            return p ? p.id : 'custom';
        }

        function renderCornerInputs() {
            const d = i18n[currentLang];
            $('board-corner-inputs').innerHTML = GordixTable.BOARD_CORNERS.map(bc => `
                <div>
                    <div class="text-[11px] font-black text-amber-700 dark:text-amber-400 mb-1">${bc.id} ${d.boardCorner}</div>
                    <div class="grid grid-cols-2 gap-2">
                        ${bc.jigs.map((j, i) => `<label class="num-field"><span>→ ${j} ${d.jig}</span><span class="num-wrap" data-unit="mm"><input type="number" id="board-${bc.id}-${i}" data-corner="${bc.id}" data-idx="${i}" class="num-in" min="1" step="0.1"></span></label>`).join('')}
                    </div>
                </div>`).join('');
        }

        // 把狀態寫回欄位（使用者正在輸入的那一格不動）
        function syncFields() {
            const d = i18n[currentLang];
            const set = (id, v) => { const el = $(id); if (document.activeElement !== el) el.value = v; };
            const { id, tables, configured } = tableInfo();
            $('table-select').innerHTML = Object.keys(tables).map(k =>
                `<option value="${k}" ${k === id ? 'selected' : ''}>${d.tableName} ${k} — ${tables[k].S} × ${tables[k].W} mm</option>`).join('');
            const r = GordixTable.workRange(tables[id]);
            $('table-info').innerText = d.rangeLine.replace('{w}', r.x * 2).replace('{h}', r.y * 2) + ` (±${r.x}, ±${r.y})`;
            $('table-unset').classList.toggle('hidden', configured);

            $('board-on').checked = board.on;
            $('board-fields').style.opacity = board.on ? '1' : '0.4';
            $('board-size').innerHTML = GordixTable.BOARD_SIZES.map(s =>
                `<option value="${s.id}">${s.id.replace('x', '×')} (${s.w} × ${s.h})</option>`).join('') +
                `<option value="custom">${d.custom}</option>`;
            $('board-size').value = pickedCustom ? 'custom' : sizePreset();
            set('board-w', board.w); set('board-h', board.h); set('board-t', board.t);
            const measure = board.mode === 'measure';
            document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === board.mode));
            $('measure-fields').classList.toggle('hidden', !measure);
            GordixTable.BOARD_CORNERS.forEach(bc => [0, 1].forEach(i => set(`board-${bc.id}-${i}`, board.m[bc.id][i])));
            renderSummary();
        }

        // 板材四邊與是否超出加工範圍
        function renderSummary() {
            const d = i18n[currentLang];
            const t = tableInfo().table, r = GordixTable.workRange(t);
            const lines = [];
            if (board.mode === 'measure') {
                const p = GordixTable.boardCorners(t, board.m);
                const len = (a, b) => (p[a] && p[b]) ? Math.hypot(p[a].x - p[b].x, p[a].y - p[b].y).toFixed(1) : '—';
                lines.push(`${d.boardEdges}: N ${len('NW', 'NE')} · S ${len('SW', 'SE')} · W ${len('NW', 'SW')} · E ${len('NE', 'SE')} mm`);
                const bad = GordixTable.BOARD_CORNERS.filter(bc => !p[bc.id]).map(bc => bc.id);
                if (bad.length) lines.push(`⚠ ${bad.join(', ')} ${d.boardUnlocated}`);
            }
            const poly = GordixTable.boardShape(t, board);
            if (poly) lines.push(poly.some(q => Math.abs(q.x) > r.x || Math.abs(q.y) > r.y) ? d.outNote : d.inNote);
            $('board-summary').innerText = lines.join('\n');
        }

        // 預覽：工作台、治具、加工範圍、板材，縮放到剛好看得到整個工作台
        function renderPreview() {
            const svg = $('preview');
            const t = tableInfo().table;
            const jig = Object.values(GordixTable.corners(t));
            const minX = Math.min(...jig.map(p => p.x)), maxX = Math.max(...jig.map(p => p.x));
            const minY = Math.min(...jig.map(p => -p.y)), maxY = Math.max(...jig.map(p => -p.y));
            const rect = svg.getBoundingClientRect();
            if (!rect.width || !rect.height) return;
            const aspect = rect.width / rect.height;
            const w = Math.max((maxX - minX) * 1.12, (maxY - minY) * 1.25 * aspect), h = w / aspect;
            svg.setAttribute('viewBox', `${(minX + maxX) / 2 - w / 2} ${(minY + maxY) / 2 - h / 2} ${w} ${h}`);
            const d = i18n[currentLang];
            svg.innerHTML = GordixWorkspace.staticSvg({
                table: t, board, u: w / rect.width, isDark: document.documentElement.classList.contains('dark'),
                labels: { tableName: d.tableName, front: d.front, legendRange: d.legendRange, legendBoard: d.legendBoard }
            });
        }

        function render() {
            syncFields();
            renderPreview();
        }

        // 改任何板材欄位都代表要用板材，所以順便打勾
        function update(fn) {
            board.on = true;
            fn();
            save();
            render();
        }

        // 選尺寸、改長寬、轉向：一定是「工作台正中央」模式（量測模式下也能直接改，自動切回置中）
        const updateSize = fn => update(() => { board.mode = 'size'; fn(); });

        function applyLanguage() {
            const d = i18n[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => { el.innerText = d[el.dataset.i18n]; });
            $('lang-toggle-text').innerText = currentLang === 'zh' ? '中文 / EN' : 'EN / 中文';
            renderCornerInputs();
            render();
        }

        function setTheme(theme) {
            document.documentElement.classList.toggle('dark', theme === 'dark');
            $('theme-icon').innerHTML = theme === 'dark'
                ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z" />'
                : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />';
            localStorage.setItem('gordix-theme', theme);
            renderPreview();
        }

        const num = (el, min) => { const v = parseFloat(el.value); return v >= min ? v : null; };

        $('table-select').onchange = e => update(() => { board.table = e.target.value; });
        $('board-on').onchange = e => { board.on = e.target.checked; save(); render(); };
        $('board-size').onchange = e => updateSize(() => {
            const p = GordixTable.BOARD_SIZES.find(s => s.id === e.target.value);
            pickedCustom = !p;
            if (p) { board.w = p.w; board.h = p.h; }
        });
        $('board-size').addEventListener('change', () => { if (pickedCustom) $('board-w').focus(); });
        $('board-rotate').onclick = () => updateSize(() => { [board.w, board.h] = [board.h, board.w]; });
        [['board-w', 'w'], ['board-h', 'h']].forEach(([id, key]) =>
            $(id).addEventListener('input', e => { const v = num(e.target, 1); if (v !== null) updateSize(() => { board[key] = v; }); }));
        $('board-t').addEventListener('input', e => { const v = num(e.target, 0.1); if (v !== null) update(() => { board.t = v; }); });
        document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => update(() => { board.mode = b.dataset.mode; }));
        $('board-corner-inputs').addEventListener('input', e => {
            const el = e.target;
            if (!el.dataset.corner) return;
            update(() => { board.m[el.dataset.corner][parseInt(el.dataset.idx, 10)] = parseFloat(el.value) || 0; });
        });
        $('btn-next').addEventListener('click', save); // 沒改任何值直接按下一步，也算確認過毛胚

        $('lang-toggle').onclick = () => {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            localStorage.setItem('gordix-lang', currentLang);
            applyLanguage();
        };
        $('theme-toggle').onclick = () => setTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
        new ResizeObserver(renderPreview).observe($('preview'));

        setTheme(localStorage.getItem('gordix-theme') || 'dark');
        applyLanguage();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => { }));
        }
    </script>
</body>
</html>
